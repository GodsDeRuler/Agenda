/* ---------- To-do's uit producten (naar voorbeeld van Restau) ---------- */
/* Plakken in horeca-agenda.html binnen de IIFE, vóór de regel `boot();`. Zie producttaken-integratie.md.
   Een product met todoText en/of todoDays zet een taak op de reservering waaraan de offerte hangt,
   x dagen voor de feestdatum. Taken krijgen source "product:<id>", zodat een volgende run niets dubbel maakt. */
const PRODUCT_TASK = "product:";
function productTaskWanted(q, r) {
  if (!q || !r || !r.date || q.status === "afgewezen" || r.status === "geannuleerd") return [];
  const products = Array.isArray(S.settings.products) ? S.settings.products : [];
  const qty = new Map();
  for (const l of q.lines || []) if (l.productId && !l.optional) qty.set(l.productId, (qty.get(l.productId) || 0) + (+l.qty || 0));
  const out = [];
  for (const [id, n] of qty) {
    const p = products.find(x => x.id === id);
    if (!p || (!String(p.todoText || "").trim() && (p.todoDays === "" || p.todoDays == null))) continue;
    const days = p.todoDays === "" || p.todoDays == null ? 0 : +p.todoDays;
    out.push({ text: `${String(p.todoText || "").trim() || "Bestellen"}: ${n} × ${p.name}`, due: addDays(r.date, -days), done: false, source: PRODUCT_TASK + id });
  }
  return out;
}
// Brengt de producttaken van een reservering in lijn met haar offerte: nieuwe erbij, gewijzigde bijwerken, vervallen (nog niet afgevinkte) weg.
async function syncProductTasks(q, r) {
  r = r || (q && q.reservationId && S.reservations.get(q.reservationId));
  if (!r || !r.id) return;
  q = q || (r.quoteId && S.quotes.get(r.quoteId));
  if (q && q.reservationId && q.reservationId !== r.id) return;
  const wanted = productTaskWanted(q, r), cur = structuredClone(r.tasks || []);
  const next = [];
  for (const t of cur) {
    if (!String(t.source || "").startsWith(PRODUCT_TASK)) { next.push(t); continue; }
    const w = wanted.find(x => x.source === t.source);
    if (w) next.push(t.done ? t : { ...t, text: w.text, due: w.due });
    else if (t.done) next.push(t);
  }
  for (const w of wanted) if (!cur.some(t => t.source === w.source)) next.push(w);
  if (JSON.stringify(next) === JSON.stringify(cur)) return;
  if (await write("reservations/" + r.id, { tasks: next, updatedAt: new Date().toISOString() }, "update")) {
    const added = next.length - cur.length;
    if (added > 0) toast(`${added} taak${added === 1 ? "" : "en"} uit producten op de reservering gezet`);
  }
}
/* ---------- Financiën: betalingen en facturen (naar voorbeeld van Restau) ---------- */
/* Plakken in horeca-agenda.html binnen de IIFE, vóór de regel `boot();`. Zie financien-integratie.md.
   Per geaccepteerde offerte de termijnen aanbetaling, (optioneel) 2e betaling en eindafrekening.
   Facturen staan in de collectie invoices; de betaald-vinkjes blijven op de offerte (depositPaid, secondPaid, finalPaid). */
const FIN_DEFAULT = { prefix: "HCT", termijnDagen: 14, secondPct: 0, secondWeeks: 4 };
const FIN_TYPES = { "1e": "Aanbetaling", "2e": "2e betaling", eind: "Eindfactuur", credit: "Creditfactuur" };
const FIN_SHORT = { "1e": "1e", "2e": "2e", eind: "eind" };
const FIN_FLAG = { "1e": "deposit", "2e": "second", eind: "final" };
const finCfg = () => ({ ...FIN_DEFAULT, ...((S.settings.locatie || {}).betaal || {}) });
const finNum = (v, d) => v === "" || v == null || isNaN(+v) ? d : +v;
const finR2 = n => Math.round((+n || 0) * 100) / 100;
const finEventDate = q => q.eventDate || (q.reservationId && S.reservations.get(q.reservationId)?.date) || "";
const finPayTerm = q => { const c = q && q.customerId && S.customers.get(q.customerId); return finNum(c && c.payTerm, finNum(finCfg().termijnDagen, 14)); };
const finInvoices = () => [...S.invoices.values()];
const finLine = l => ({ desc: l.desc || "", qty: +l.qty || 0, price: +l.price || 0, btw: +l.btw || 0, ...(isMix(l) ? { btwHigh: +l.btwHigh } : {}) });
// Bedrag incl. btw per btw-tarief (een gemengde regel, zoals drankafkoop, telt deels bij 21% en deels bij 9%)
function finRateSplit(lines) {
  const m = new Map();
  for (const l of lines || []) {
    if (l.optional) continue;
    const t = (+l.qty || 0) * (+l.price || 0); if (!t) continue;
    const parts = isMix(l) ? [[21, t * l.btwHigh / 100], [9, t * (100 - l.btwHigh) / 100]] : [[+l.btw || 0, t]];
    for (const [rate, a] of parts) m.set(rate, (m.get(rate) || 0) + a);
  }
  return [...m.entries()].filter(([, a]) => Math.abs(a) > 0.004).sort((a, b) => a[0] - b[0]);
}
// De termijnen van één offerte, met bedrag, vervaldatum, factuur en of het betaald is.
function finTerms(q) {
  const tot = totals(q.lines).incl, ev = finEventDate(q), term = finPayTerm(q), cfg = finCfg();
  const dp = finNum(q.depositPct, 30), sp = finNum(q.secondPct, finNum(cfg.secondPct, 0));
  const invs = finInvoices().filter(i => i.quoteId === q.id && i.type !== "credit" && !i.creditedBy);
  const out = [];
  if (dp > 0) out.push({ key: "1e", label: `Aanbetaling ${dp}%`, pct: dp });
  if (sp > 0) out.push({ key: "2e", label: `2e betaling ${sp}%`, pct: sp });
  out.push({ key: "eind", label: "Eindafrekening", pct: Math.max(0, 100 - dp - sp) });
  const accepted = q.acceptedOn || q.date || todayISO;
  for (const t of out) {
    const f = FIN_FLAG[t.key];
    t.inv = invs.find(i => i.type === t.key) || null;
    t.amount = t.inv ? totals(t.inv.lines).incl : finR2(tot * t.pct / 100);
    t.paid = !!q[f + "Paid"]; t.paidOn = q[f + "PaidOn"] || (t.inv && t.inv.paidOn) || "";
    t.due = t.inv?.dueDate || (t.key === "1e" ? addDays(accepted, term) : !ev ? "" : t.key === "2e" ? addDays(ev, -7 * finNum(q.secondWeeks, finNum(cfg.secondWeeks, 4))) : addDays(ev, term));
  }
  const e = out[out.length - 1];
  if (!e.inv) e.amount = finR2(tot - out.slice(0, -1).reduce((s, t) => s + t.amount, 0));
  if (!e.inv && Math.abs(e.amount) < 0.005) e.paid = true; // niets meer te betalen
  for (const t of out) t.late = !t.paid && !!t.due && t.due < todayISO;
  return out;
}
// Offertes die in Betalingen horen: geaccepteerd (feest niet geannuleerd), of er is al een factuur voor.
function finQuotes() {
  const withInv = new Set(finInvoices().map(i => i.quoteId));
  return [...S.quotes.values()].filter(q => {
    const r = q.reservationId && S.reservations.get(q.reservationId);
    return withInv.has(q.id) || (q.status === "geaccepteerd" && !(r && r.status === "geannuleerd"));
  });
}
// Facturen die gemaakt moeten worden: aanbetaling meteen, 2e betaling 14 dagen voor de uiterste datum, eindfactuur vanaf de feestdag.
function finToMake() {
  const out = [];
  for (const q of finQuotes()) {
    if (q.status !== "geaccepteerd") continue;
    const ev = finEventDate(q);
    for (const t of finTerms(q)) {
      if (t.inv || t.paid || t.amount <= 0) continue;
      const from = t.key === "1e" ? "" : t.key === "2e" ? addDays(t.due || todayISO, -14) : (ev || "9999-12-31");
      if (from <= todayISO) out.push({ q, t });
    }
  }
  return out.sort((a, b) => (a.t.due || "9999").localeCompare(b.t.due || "9999"));
}
function finNextNumber(date) {
  const pre = String(finCfg().prefix || "").trim() + String(date || todayISO).slice(2, 4);
  const n = finInvoices().map(i => String(i.number || "")).filter(x => x.startsWith(pre) && /^\d+$/.test(x.slice(pre.length))).map(x => +x.slice(pre.length));
  return pre + String((n.length ? Math.max(...n) : 0) + 1).padStart(4, "0");
}
function finIsLastNumber(inv) {
  const pre = String(inv.number || "").replace(/\d{4,}$/, "");
  const same = finInvoices().map(i => String(i.number || "")).filter(x => x.startsWith(pre) && /^\d+$/.test(x.slice(pre.length)));
  return same.every(x => +x.slice(pre.length) <= +String(inv.number).slice(pre.length));
}
function finInvStatus(inv) {
  if (inv.creditedBy) return { k: "credited", cls: "c0", txt: `Gecrediteerd (${S.invoices.get(inv.creditedBy)?.number || "creditfactuur"})` };
  if (inv.type === "credit") return inv.paidOn ? { k: "betaald", cls: "c1", txt: `Verrekend op ${shortDate(inv.paidOn)}` } : { k: "credit", cls: "c0", txt: `Credit op ${S.invoices.get(inv.creditOf)?.number || "factuur"}` };
  if (inv.paidOn) return { k: "betaald", cls: "c1", txt: `Betaald op ${shortDate(inv.paidOn)}` };
  if (inv.dueDate && inv.dueDate < todayISO) return { k: "late", cls: "c3", txt: `Te laat, vervallen ${shortDate(inv.dueDate)}` };
  return { k: "open", cls: "c2", txt: inv.dueDate ? `Te ontvangen voor ${shortDate(inv.dueDate)}` : "Open" };
}

/* Factuur maken, crediteren en betaald markeren */
async function finMakeInvoice(q, type, src) {
  if (S.readOnly) return null;
  const base = type === "credit" ? src : null, from = base || q;
  const cid = (q && q.customerId) || (base && base.customerId) || "", c = cid && S.customers.get(cid);
  const date = todayISO, now = new Date().toISOString();
  let lines, dueDate = addDays(date, finPayTerm(q || base));
  if (type === "credit") { lines = base.lines.map(l => ({ ...l, qty: -(+l.qty || 0) })); dueDate = date; }
  else if (type === "eind") {
    lines = (q.lines || []).filter(l => !l.optional && (l.desc || +l.price)).map(finLine);
    for (const t of finTerms(q).filter(t => t.key !== "eind")) {
      if (t.inv) lines.push(...t.inv.lines.map(l => ({ ...finLine(l), desc: `Af: ${FIN_TYPES[t.key].toLowerCase()}, factuur ${t.inv.number}${finRateSplit(t.inv.lines).length > 1 ? ` (${l.btw}% btw)` : ""}`, qty: -(+l.qty || 0) })));
      else if (t.paid) lines.push(...finRateSplit(q.lines).map(([rate, a], i, all) => ({ desc: `Af: ${t.label.toLowerCase()}, ontvangen${all.length > 1 ? ` (${rate}% btw)` : ""}`, qty: -1, price: finR2(a * t.pct / 100), btw: rate })));
    }
  } else {
    const t = finTerms(q).find(x => x.key === type), split = finRateSplit(q.lines);
    if (!t || !split.length) { toast("Deze offerte heeft nog geen bedrag om te factureren"); return null; }
    lines = split.map(([rate, a]) => ({ desc: `${t.label} op offerte ${q.number}${split.length > 1 ? ` (deel tegen ${rate}% btw)` : ""}`, qty: 1, price: finR2(a * t.pct / 100), btw: rate }));
    if (type === "2e" && t.due && t.due > dueDate) dueDate = t.due;
  }
  const inv = {
    number: finNextNumber(date), type, quoteId: (q && q.id) || (base && base.quoteId) || "", reservationId: (q && q.reservationId) || (base && base.reservationId) || "", customerId: cid,
    customer: from.customer || "", contact: from.contact || "", email: from.email || "", address: (c && c.address) || (base && base.address) || "", invoiceInfo: (c && c.invoice) || (base && base.invoiceInfo) || "",
    quoteNumber: q ? q.number || "" : (base && base.quoteNumber) || "", eventDate: q ? finEventDate(q) : (base && base.eventDate) || "",
    date, dueDate, lines, notes: "", paidOn: "", creditOf: base ? base.id : "", createdAt: now, updatedAt: now,
  };
  const id = uid();
  if (!(await write("invoices/" + id, inv))) return null;
  const fz = finFreeze(q); if (Object.keys(fz).length && (await write("quotes/" + q.id, fz, "update"))) { const cur = S.quotes.get(q.id); if (cur) Object.assign(cur, fz); }
  S.invoices.set(id, { ...inv, id });
  if (base) { await write("invoices/" + base.id, { creditedBy: id, updatedAt: now }, "update"); const b = S.invoices.get(base.id); if (b) b.creditedBy = id; }
  toast(`${FIN_TYPES[type]} ${inv.number} gemaakt`);
  return S.invoices.get(id);
}
// Legt de 2e betaling vast op de offerte, zodat een latere wijziging van de standaard bestaande feesten niet verandert.
const finFreeze = q => q && (q.secondPct === "" || q.secondPct == null) ? { secondPct: finNum(finCfg().secondPct, 0), secondWeeks: finNum(q.secondWeeks, finNum(finCfg().secondWeeks, 4)) } : {};
async function finSetPaid(q, key, paidOn) {
  const f = FIN_FLAG[key]; if (!f) return false;
  const patch = { ...finFreeze(q), [f + "Paid"]: !!paidOn, [f + "PaidOn"]: paidOn || "", updatedAt: new Date().toISOString() };
  const t = finTerms(q).find(x => x.key === key);
  if (!(await write("quotes/" + q.id, patch, "update"))) return false;
  const cur = S.quotes.get(q.id); if (cur) Object.assign(cur, patch);
  if (t && t.inv) { await write("invoices/" + t.inv.id, { paidOn: paidOn || "", updatedAt: patch.updatedAt }, "update"); const i = S.invoices.get(t.inv.id); if (i) i.paidOn = paidOn || ""; }

}
async function finSetInvoicePaid(inv, paidOn) {
  const now = new Date().toISOString();
  if (!(await write("invoices/" + inv.id, { paidOn: paidOn || "", updatedAt: now }, "update"))) return false;
  const i = S.invoices.get(inv.id); if (i) i.paidOn = paidOn || "";
  const f = FIN_FLAG[inv.type], q = inv.quoteId && S.quotes.get(inv.quoteId);
  if (f && q) { const patch = { [f + "Paid"]: !!paidOn, [f + "PaidOn"]: paidOn || "", updatedAt: now }; if (await write("quotes/" + q.id, patch, "update")) { const cur = S.quotes.get(q.id); if (cur) Object.assign(cur, patch); } }
  return true;
}

function finRows() {
  return finQuotes().map(q => {
    const terms = finTerms(q), open = terms.filter(t => !t.paid);
    return { q, terms, ev: finEventDate(q), tot: totals(q.lines).incl, open: open.reduce((s, t) => s + t.amount, 0), next: open.map(t => t.due).filter(Boolean).sort()[0] || "", late: open.some(t => t.late), lateAmt: open.filter(t => t.late).reduce((s, t) => s + t.amount, 0) };
  });
}
const finChip = t => `<span class="chip ${t.paid ? "c1" : t.late ? "c3" : "c2"}" title="${esc(`${t.label}: ${eur(t.amount)}${t.paid ? ", betaald" + (t.paidOn ? " op " + shortDate(t.paidOn) : "") : t.due ? ", te ontvangen voor " + shortDate(t.due) : ""}${t.inv ? ", factuur " + t.inv.number : ""}`)}">${FIN_SHORT[t.key]} ${t.paid ? "✓" : t.late ? "te laat" : "open"}</span>`;
function vBetalingen() {
  const f = S.payFilter || "open", rows = finRows(), in30 = addDays(todayISO, 30);
  const isOpen = x => x.open > 0.004 || x.terms.some(t => !t.paid);
  const sel = rows.filter(x => f === "alle" ? true : f === "betaald" ? !isOpen(x) : f === "late" ? x.late : isOpen(x))
    .sort((a, b) => f === "open" || f === "late" ? (a.ev || "9999").localeCompare(b.ev || "9999") : (b.ev || "").localeCompare(a.ev || ""));
  const sumOpen = rows.reduce((s, x) => s + x.open, 0), sumLate = rows.reduce((s, x) => s + x.lateAmt, 0);
  const soon = rows.reduce((s, x) => s + x.terms.filter(t => !t.paid && t.due && t.due >= todayISO && t.due <= in30).reduce((a, t) => a + t.amount, 0), 0);
  const tabs = [["open", "Openstaand", rows.filter(isOpen).length], ["late", "Te laat", rows.filter(x => x.late).length], ["betaald", "Volledig betaald", rows.filter(x => !isOpen(x)).length], ["alle", "Alle", rows.length]];
  let lastM = null;
  const body = sel.map(x => {
    const m = (x.ev || "").slice(0, 7);
    const hdr = m !== lastM ? (lastM = m, `<tr class="fin-grp"><td colspan="6">${m ? esc(MONTHS[+m.slice(5) - 1] + " " + m.slice(0, 4)) : "Zonder feestdatum"}</td></tr>`) : "";
    return hdr + `<tr class="click" data-payq="${esc(x.q.id)}"><td class="num">${x.ev ? esc(shortDate(x.ev)) : "–"}</td><td><b>${esc(x.q.customer || "(zonder naam)")}</b><br><span class="muted small">offerte ${esc(x.q.number || "")}${x.q.status !== "geaccepteerd" ? " · " + esc(x.q.status) : ""}</span></td><td class="r fin-sm-hide" style="white-space:nowrap">${eur(x.tot)}</td><td><span class="fin-terms">${x.terms.map(finChip).join("")}</span></td><td class="r" style="white-space:nowrap;${x.late ? "color:var(--bad);font-weight:600" : ""}">${x.open > 0.004 ? eur(x.open) : "–"}</td><td class="num" style="white-space:nowrap">${x.next ? esc(shortDate(x.next)) : x.open > 0.004 ? "Te bepalen" : "–"}</td></tr>`;
  }).join("");
  return `<section class="stack">
    <div class="row spread"><h2>Betalingen</h2><div class="row"><button class="btn" data-v="facturen">Facturen</button><button class="btn ghost" id="fin-cfg">Betaalinstellingen</button></div></div>
    <div class="panel stats">
      <div class="stat pitch"><span class="eyebrow">Nog te ontvangen</span><b class="num">${eur(sumOpen)}</b><span class="muted small">${rows.filter(isOpen).length} feesten met een open termijn</span></div>
      <div class="stat bar"><span class="eyebrow">Waarvan te laat</span><b class="num" style="${sumLate ? "color:var(--bad)" : ""}">${eur(sumLate)}</b><span class="muted small">${rows.filter(x => x.late).length} feesten</span></div>
      <div class="stat club"><span class="eyebrow">Komende 30 dagen</span><b class="num">${eur(soon)}</b><span class="muted small">termijnen die vervallen</span></div>

    <div class="panel tbl-wrap">${sel.length ? `<table><thead><tr><th>Feest</th><th>Klant</th><th class="r fin-sm-hide">Totaal</th><th>Termijnen</th><th class="r">Nog te ontvangen</th><th>Volgende betaling</th></tr></thead><tbody>${body}</tbody></table>`
      : `<p class="empty">${rows.length ? "Geen feesten in deze lijst." : "Nog geen geaccepteerde offertes. Zodra een offerte op geaccepteerd staat, verschijnen hier de termijnen."}</p>`}</div>
    <p class="small muted" style="margin:0">Klik op een feest om een termijn als betaald te markeren of er een factuur van te maken. Aanbetaling standaard 30%, per offerte of vaste klant aan te passen.</p>
  </section>`;
}

function finOpenPay(qid) {

    if (!groups.has(cat)) groups.set(cat, []);

  }).join("");

/* Kopiëren (reeks): hetzelfde event op meer data, zoals Restau */
function seriesDates(from, to, every, days) {
  const out = []; if (!from || !to || to < from) return out;
  for (let d = from, n = 0; d <= to && n < 400; n++) {
    const wd = parseISO(d).getDay(), we = wd === 0 || wd === 6;
    if (days === "alle" || (days === "weekend" && we) || (days === "week" && !we)) out.push(d);
    if (every === "dag") d = addDays(d, 1);
    else if (every === "week") d = addDays(d, 7);
    else { const x = parseISO(d); x.setMonth(x.getMonth() + 1); d = iso(x); }
  }
  return out;
}

/* Backups: vorige versies van een event en zijn offerte, automatisch bij opslaan (hoogstens één per 10 minuten) */
const BACKUP_KEEP = 12;
async function backupsOf(key) {
  if (S.backups.has(key)) return S.backups.get(key);
  let v = { items: [] };
  if (S.db) { try { const snap = await S.db.doc("backups/" + key).get(); if (snap && snap.exists) v = snap.data() || v; } catch (e) {} }
  S.backups.set(key, v); return v;
}
async function backupBefore(path, mode) {
  const [col, id] = path.split("/"); if ((col !== "reservations" && col !== "quotes") || !id) return;
  const cur = (col === "reservations" ? S.reservations : S.quotes).get(id); if (!cur) return;
  const key = col === "reservations" ? id : (cur.reservationId || "q-" + id), prev = (await backupsOf(key)).items || [];
  const last = prev.find(x => x.kind === col); if (last && Date.now() - new Date(last.at).getTime() < 10 * 60e3 && mode !== "delete") return;
  const { id: _x, ...data } = cur;
  const items = [{ at: new Date().toISOString(), kind: col, id, data: JSON.parse(JSON.stringify(data)), reason: mode === "delete" ? "verwijderd" : "gewijzigd" }, ...prev].slice(0, BACKUP_KEEP);
  S.backups.set(key, { items });
  if (S.db) { try { await S.db.doc("backups/" + key).set({ items }); } catch (e) {} }
}
const _writeNoBackup = write;
write = async function (path, data, mode = "set") { if (!/^backups\//.test(path)) await backupBefore(path, mode); return _writeNoBackup(path, data, mode); };
async function openBackups(r) {
  const items = (await backupsOf(r.id)).items || [];
  $("#modal-root").innerHTML = `<div class="scrim" id="scrim"><div class="modal" style="max-width:620px">
    <div class="row spread"><h2>Backups</h2><button type="button" class="btn ghost" id="bk-x" aria-label="Sluiten">✕</button></div>
    <p class="small muted" style="margin:0">Bij elke wijziging bewaart de agenda de vorige versie van dit event en zijn offerte (de laatste ${BACKUP_KEEP}, hoogstens één per 10 minuten).</p>
    ${items.length ? `<div class="list">${items.map((x, i) => `<div class="it"><span class="t">${esc(shortDate(x.at.slice(0, 10)))}<br><span class="small muted">${esc(new Date(x.at).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }))}</span></span><span>${x.kind === "quotes" ? `Offerte ${esc(x.data.number || "")} · ${esc(x.data.status || "")} · ${eur(totals(x.data.lines || []).incl)}` : `Event · ${esc(shortDate(x.data.date))} ${esc(x.data.start || "")} · ${esc(roomName(x.data.roomId))} · ${esc(x.data.persons || "?")} p. · ${esc(x.data.status || "")}`}<br><span class="small muted">versie van vóór: ${esc(x.reason)}</span></span><button class="btn small" data-bkrestore="${i}" ${S.readOnly ? "disabled" : ""}>Terugzetten</button></div>`).join("")}</div>` : `<p class="empty">Nog geen backups. Die ontstaan vanzelf zodra het event of de offerte wordt gewijzigd.</p>`}
  </div></div>`;
  document.body.style.overflow = "hidden";
  $("#bk-x").onclick = closeModal;
  document.querySelectorAll("[data-bkrestore]").forEach(b => b.onclick = async () => {
    const x = items[+b.dataset.bkrestore]; if (!x || !confirm("Deze versie terugzetten? De huidige versie wordt eerst als backup bewaard.")) return;
    if (await write(x.kind + "/" + x.id, { ...x.data, updatedAt: new Date().toISOString() })) { closeModal(); toast("Versie teruggezet"); render(); }
  });
}

const mailDef = k => MAIL_DEFS.find(d => d.key === k);
// Tekst van een mail voor een soort feest: standaard, aangepaste standaard, eventueel eigen tekst voor die soort.
function mailTpl(key, typeId, m = S.mail || {}) {
  const d = mailDef(key); if (!d) return { on: false, subject: "", body: "" };
  const std = { on: d.on, subject: d.subject, body: d.body, ...((m.texts || {})[key] || {}) };
  const pt = typeId && ((m.perType || {})[typeId] || {})[key];
  return { on: pt && pt.on != null ? !!pt.on : !!std.on, subject: pt && pt.own ? pt.subject ?? std.subject : std.subject, body: pt && pt.own ? pt.body ?? std.body : std.body };
}
function mailCtx({ r, q, inv, term } = {}) {
  q = q || (r && r.quoteId && S.quotes.get(r.quoteId)) || (inv && inv.quoteId && S.quotes.get(inv.quoteId)) || null;
  r = r || (q && q.reservationId && S.reservations.get(q.reservationId)) || (inv && inv.reservationId && S.reservations.get(inv.reservationId)) || null;
  const cid = (r && r.customerId) || (q && q.customerId) || (inv && inv.customerId) || "", c = cid && S.customers.get(cid);
  const L = S.settings.locatie || {}, date = (r && r.date) || (q && q.eventDate) || (inv && inv.eventDate) || "";
  const klant = (r && r.customer) || (q && q.customer) || (inv && inv.customer) || (c && c.name) || "", contact = (r && r.contact) || (q && q.contact) || (inv && inv.contact) || (c && c.contact) || "";
  const roomId = (r && r.roomId) || (q && q.roomId) || "";
  const v = {
    klant, contactpersoon: contact || klant, aanhef: `Beste ${contact || klant || "gast"},`, datum: date ? longDate(date) : "", tijd: r ? [r.start, r.end].filter(Boolean).join(" tot ") : String((q && q.eventTime) || "").replace(/\s*[–-]\s*/, " tot "),
    ruimte: roomId ? roomName(roomId) : "", personen: String((r && r.persons) || (q && q.persons) || ""),
    offertenummer: (q && q.number) || (inv && inv.quoteNumber) || "", bedrag: q ? eur(totals(q.lines).incl) : "", geldig_tot: q && q.validUntil ? longDate(q.validUntil) : "",
    optie_tot: r && r.optieTot ? longDate(r.optieTot) : "", dagen_optie: r && r.optieTot ? String(Math.max(0, Math.round((parseISO(r.optieTot) - parseISO(todayISO)) / 864e5))) : "",
    factuurnummer: (inv && inv.number) || "", factuurbedrag: inv ? eur(Math.abs(totals(inv.lines).incl)) : "", vervaldatum: inv && inv.dueDate ? longDate(inv.dueDate) : "",
    termijn: term ? term.label : "", betaalbedrag: term ? eur(term.amount) : "",
    iban: L.iban || "onze rekening", locatie: L.naam || "HC Tilburg Horeca", telefoon_locatie: L.telefoon || "", email_locatie: L.email || "", afzender: (r && r.manager) || (q && q.manager) || "Team horeca",
  };

function mailFill(text, v) {
  const sig = String((S.mail && S.mail.signature) ?? MAIL_SIGNATURE);
  const one = (t, vals) => String(t || "").replace(/\{([a-z_]+)\}/g, (m, k) => k in vals ? vals[k] : m);
  const out = one(text, { ...v, handtekening: one(sig, v) });
  return out.split("\n").map(l => l.replace(/^\s*·\s*|\s*·\s*$/g, "").replace(/ {2,}/g, " ")).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
const mailHref = (to, subject, body) => `mailto:${encodeURIComponent(to || "")}?subject=${encodeURIComponent(subject || "")}&body=${encodeURIComponent(body || "")}`;

/* Opslag: settings/mail (één document) en outbox (collectie). In lokale modus alleen in het geheugen. */
async function mailSave(data) {
  if (S.readOnly) { toast("Je hebt alleen leesrechten op deze agenda"); return false; }
  const body = JSON.parse(JSON.stringify(data));
  if (!S.db) { S.mail = body; toast("Opslag niet beschikbaar: wijziging alleen lokaal zichtbaar"); return true; }
  try { await S.db.doc("settings/mail").set(body); S.mail = body; return true; } catch (e) { toast("Opslaan mislukt, probeer het opnieuw"); return false; }
}
async function obWrite(id, data, mode = "set") {
  if (!S.db) { if (mode === "delete") S.outbox.delete(id); else S.outbox.set(id, { ...(mode === "update" ? S.outbox.get(id) : {}), ...data, id }); return true; }
  try { const ref = S.db.doc("outbox/" + id); if (mode === "delete") await ref.delete(); else await ref[mode](data); if (mode !== "delete") S.outbox.set(id, { ...(mode === "update" ? S.outbox.get(id) : {}), ...data, id }); return true; }
  catch (e) { if (e && e.code === "invalid_argument") { S.readOnly = true; render(); } else toast("Opslaan mislukt, probeer het opnieuw"); return false; }
}
const _bootMail = boot;
boot = async function () {
  await _bootMail();

  S.db.doc("settings/mail").onSnapshot(snap => {
    S.mail = snap.exists ? snap.data() : {};
    if (!S.mail.since && !S.readOnly) mailSave({ ...S.mail, since: new Date().toISOString() });
    scheduleRender();
  }, () => {});
  S.db.collection("outbox").onSnapshot(snap => {
    S.outbox.clear(); snap.docs.forEach(d => S.outbox.set(d.id, { ...d.data(), id: d.id }));
    S.outboxReady = true; scheduleRender();
  }, () => {});
};

/* Klaarzetten: welke mails horen er nu te staan? Alleen situaties ná het inbouwen (since) of binnen een tijdvenster. */
function mailWanted() {
  const since = S.mail.since, sinceD = since.slice(0, 10), out = [], seen = new Set();
  const isNew = o => (o.updatedAt || o.createdAt || "") >= since;
  const add = (key, trig, src) => {
    if (!key) return;
    const id = (key + "__" + trig).replace(/[^A-Za-z0-9_-]/g, "-");
    if (S.outbox.has(id) || seen.has(id)) return;
    const ctx = mailCtx(src), tp = mailTpl(key, ctx.r && ctx.r.eventType);
    if (!tp.on) return;
    seen.add(id);
    out.push({ id, body: { key, phase: mailDef(key).phase, to: ctx.to, subject: mailFill(tp.subject, ctx.v), body: mailFill(tp.body, ctx.v), customer: ctx.klant, customerId: ctx.cid,
      reservationId: (ctx.r && ctx.r.id) || "", quoteId: (ctx.q && ctx.q.id) || "", invoiceId: (src.inv && src.inv.id) || "", eventDate: ctx.date, status: "klaar", createdAt: new Date().toISOString(), sentAt: "" } });
  };
  for (const r of S.reservations.values()) {
    if (!r.date || r.status === "geannuleerd") continue;
    if (r.status === "optie" && r.date >= todayISO) {
      if (isNew(r)) add("optie_gezet", r.id, { r });
      if (r.optieTot && r.optieTot >= todayISO && r.optieTot <= addDays(todayISO, 3)) add("optie_bijna", r.id + "_" + r.optieTot, { r });
      if (r.optieTot && r.optieTot < todayISO) add("optie_verlopen", r.id + "_" + r.optieTot, { r });
    }
    if (r.status === "bevestigd" && r.date >= todayISO) {
      if (isNew(r)) add("bevestiging", r.id, { r });
      if (r.date >= addDays(todayISO, 3) && r.date <= addDays(todayISO, 7)) add("bijna_zover", r.id, { r });
    }
    if ((r.status === "bevestigd" || r.status === "afgerond") && r.date < todayISO && r.date >= addDays(todayISO, -3) && r.date >= addDays(sinceD, -1)) add("after_sales", r.id, { r });
  }
  for (const q of S.quotes.values()) {
    if (q.status === "verstuurd") {
      if (isNew(q)) add("offerte_nieuw", q.id, { q });
      if (q.validUntil && q.validUntil >= todayISO && q.validUntil <= addDays(todayISO, 3)) add("offerte_herinnering", q.id + "_" + q.validUntil, { q });
    }
    if (q.status === "afgewezen" && isNew(q)) add("offerte_afgewezen", q.id, { q });
    if (typeof finTerms === "function" && q.status === "geaccepteerd") for (const t of finTerms(q)) if (t.paid && t.paidOn && t.paidOn >= sinceD) add("betaling_ontvangen", q.id + "_" + t.key, { q, term: t });
  }
  if (S.invoices) for (const inv of S.invoices.values()) {
    if ((inv.createdAt || "") >= since) add({ "1e": "factuur_1e", "2e": "factuur_2e", eind: "factuur_eind", credit: "factuur_credit" }[inv.type], inv.id, { inv });
    if (inv.type !== "credit" && !inv.paidOn && !inv.creditedBy && inv.dueDate && addDays(inv.dueDate, 3) <= todayISO) add("herinnering_betaling", inv.id + "_1", { inv });
  }
  return out;
}
let mailScanT = null, mailScanning = false;
function mailScheduleScan() { if (mailScanT || S.readOnly) return; mailScanT = setTimeout(() => { mailScanT = null; mailScan(); }, 1000); }
async function mailScan() {

  try { for (const it of mailWanted()) if (!S.outbox.has(it.id) && await obWrite(it.id, it.body)) n++; }

/* Weergave Week- en zaalagenda */
const weekStartOf = d => addDays(d, -((parseISO(d).getDay() + 6) % 7));
function isoWeek(d) { const x = parseISO(d); x.setDate(x.getDate() + 3 - (x.getDay() + 6) % 7); const w1 = new Date(x.getFullYear(), 0, 4); return 1 + Math.round(((x - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); }
// Minikalender (zoals in Restau): twee maanden, stip = drukte, klik = naar die week
const wkMonthAdd = (ms, n) => { const [y, m] = ms.split("-").map(Number), t = y * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, "0")}-01`; };
function wkMiniCal(ws) {
  const m0 = S.wkMonth || ws.slice(0, 8) + "01", we = addDays(ws, 6);
  const month = ms => {
    const first = weekStartOf(ms), next = wkMonthAdd(ms, 1), cells = [];
    for (let ds = first; ds < next || cells.length % 7; ds = addDays(ds, 1)) cells.push(ds);
    const mm = parseISO(ms);
    return `<div class="mcal"><div class="mcal-h">${MONTHS[mm.getMonth()]} ${mm.getFullYear()}</div><div class="mcal-g">${DAYS_SHORT.map(d => `<span class="mcal-d">${d}</span>`).join("")}${cells.map(ds => {
      const n = resOn(ds).filter(r => r.status !== "geannuleerd").length + apptOn(ds).length, out = ds.slice(0, 7) !== ms.slice(0, 7);
      return `<button type="button" data-wkgo="${ds}" class="${out ? "out " : ""}${ds === todayISO ? "now " : ""}${ds >= ws && ds <= we ? "inwk" : ""}" title="${esc(longDate(ds))}${n ? ` · ${n} ${n === 1 ? "boeking" : "boekingen"}` : ""}">${parseISO(ds).getDate()}${n ? `<i class="${n > 2 ? "hi" : ""}"></i>` : ""}</button>`;
    }).join("")}</div></div>`;
  };
  return `<aside class="mcal-wrap panel"><div class="row spread"><button class="btn ghost" id="wk-mprev" aria-label="Vorige maand">‹</button><button class="btn ghost" id="wk-mnext" aria-label="Volgende maand">›</button></div>${month(m0)}${month(wkMonthAdd(m0, 1))}</aside>`;
}
function vWeek() {
  const ws = S.weekStart || weekStartOf(S.day || todayISO), days = [...Array(7)].map((_, i) => addDays(ws, i)), rooms = S.settings.rooms;
  const it = (cls, attrs, time, text, title) => `<div class="wk-it ${cls}" ${attrs} title="${esc(title || `${time} ${text}`)}"><span class="num">${esc(time)}</span> ${esc(text)}</div>`;
  const resItems = (ds, roomId) => {
    const out = [];
    for (const r of resOn(ds)) {
      const parts = resParts(r).filter(p => roomId ? p.roomId === roomId : !rooms.some(rm => rm.id === p.roomId));
      const none = !roomId && !resParts(r).length;
      for (const p of none ? [{ start: r.start || "", end: r.end || "", name: "" }] : parts)
        out.push({ t: p.start || "", h: it(`res ${r.status === "optie" || r.status === "aanvraag" ? "optie" : ""}`, `data-res="${esc(r.id)}"`, p.start ? `${p.start}${p.end ? "–" + p.end : ""}` : "", `${r.customer || "Reservering"}${p.name ? " · " + p.name : ""}${r.persons ? ` (${r.persons})` : ""}`, `${r.customer || "Reservering"} · ${r.status}${p.name ? " · " + p.name : ""}${r.persons ? " · " + r.persons + " pers." : ""}`) });
    }
    return out;
  };
  const cell = (rm, ds) => {
    const its = resItems(ds, rm.id);
    for (const b of blocksOn(ds)) if (blockRooms(b).includes(rm.id)) its.push({ t: b.allDay ? "" : b.start, h: it("blk", `data-block="${esc(b.id)}"`, b.allDay ? "hele dag" : `${b.start}–${b.end}`, b.reason || "Geblokkeerd") });
    for (const ev of clubOn(ds)) if (clubMentionsRoom(ev, rm)) its.push({ t: ev.allDay ? "" : ev.start || "", h: it("club", "", ev.allDay ? "hele dag" : ev.start || "", ev.title) });
    for (const k of apptOn(ds)) if (k.roomId === rm.id) its.push({ t: apptTime(k), h: it("appt", `data-appt="${esc(k.id)}"`, apptTime(k), apptLabel(k)) });
    return its.sort((a, b) => (a.t || "").localeCompare(b.t || "")).map(x => x.h).join("");
  };
  const loose = days.map(ds => resItems(ds, null));
  const appts = days.map(ds => apptOn(ds).filter(k => !k.roomId || !rooms.some(rm => rm.id === k.roomId)));
  const head = days.map(ds => { const c = crowd(ds); return `<th class="${ds === todayISO ? "today" : ""}"><button type="button" data-wkday="${ds}" title="Open de dag-agenda">${esc(shortDate(ds))}</button>${c.total ? `<br><span class="chip c${c.lvl}" title="Verwachte bezoekers: ${esc(c.lvlName)}">${c.total}</span>${c.count ? ` <span class="muted small">${c.count} wedstr.</span>` : ""}` : ""}</th>`; }).join("");
  const nRes = days.reduce((s, ds) => s + resOn(ds).length, 0);
  return `<section class="stack">
    <div class="row spread">
      <div class="row"><button class="btn" id="wk-prev" aria-label="Vorige week">‹</button><h2 style="min-width:14ch">Week ${isoWeek(ws)}</h2><button class="btn" id="wk-next" aria-label="Volgende week">›</button><button class="btn ghost" id="wk-today">Deze week</button><input type="date" id="wk-pick" value="${ws}" style="width:auto" aria-label="Kies een datum"></div>
      <span class="row"><button class="btn" id="wk-appt" ${S.readOnly ? "disabled" : ""}>Afspraak maken</button><button class="btn bar" id="wk-new" ${S.readOnly ? "disabled" : ""}>Nieuwe reservering</button></span>
    </div>
    <div class="row small muted num">${esc(shortDate(ws))} t/m ${esc(shortDate(days[6]))} · ${nRes} ${nRes === 1 ? "reservering" : "reserveringen"} · ${(n => `${n} ${n === 1 ? "afspraak" : "afspraken"}`)(days.reduce((s, ds) => s + apptOn(ds).length, 0))} · klik op een lege plek om te reserveren</div>
    ${rooms.length ? `<div class="wk-wrap">${wkMiniCal(ws)}<div class="panel tbl-wrap"><table class="wk"><thead><tr><th class="wk-room"></th>${head}</tr></thead><tbody>
      ${rooms.map(rm => `<tr><td class="wk-room"><span class="dot" style="background:${esc(rm.color || "var(--bar)")}"></span> ${esc(rm.name)}${rm.capacity ? `<br><span class="muted small" style="font-weight:400">max ${esc(rm.capacity)}</span>` : ""}</td>${days.map(ds => `<td data-cell="${esc(rm.id)}|${ds}" class="${ds === todayISO ? "today" : ""}">${cell(rm, ds)}</td>`).join("")}</tr>`).join("")}
      <tr><td class="wk-room" style="color:var(--orange)">Afspraken</td>${appts.map((as, i) => `<td data-acell="${days[i]}" class="${days[i] === todayISO ? "today" : ""}">${as.map(k => it("appt", `data-appt="${esc(k.id)}"`, apptTime(k), apptLabel(k))).join("")}</td>`).join("")}</tr>
      ${loose.some(x => x.length) ? `<tr><td class="wk-room">Zonder ruimte</td>${loose.map(x => `<td>${x.map(y => y.h).join("")}</td>`).join("")}</tr>` : ""}
    </tbody></table></div></div>
    <div class="row small muted"><span class="wk-it res" style="display:inline-block;margin:0">reservering</span><span class="wk-it res optie" style="display:inline-block;margin:0">optie of aanvraag</span><span class="wk-it blk" style="display:inline-block;margin:0">geblokkeerd</span><span class="wk-it club" style="display:inline-block;margin:0">clubagenda</span><span class="wk-it appt" style="display:inline-block;margin:0">afspraak</span></div>`
    : `<p class="empty">Voeg onder Instellingen → Zalen jullie ruimtes toe om de zaalagenda te zien.</p>`}
  </section>`;
}

/* Plakken in horeca-agenda.html binnen de IIFE, vóór de regel `boot();` (ná de klantenmodule). Zie bedrijven-integratie.md.
   Een bedrijf, team of commissie (collectie companies) groepeert klanten als contactpersonen (customers.companyId).

const COMP_KINDS = ["bedrijf", "team", "commissie", "sponsor", "vereniging of school", "overig"];

const compMembers = co => [...S.customers.values()].filter(c => c.companyId === co.id).sort((a, b) => (a.name || "").localeCompare(b.name || "", "nl"));
function compData(co) {
  const members = compMembers(co);

  for (const c of members) { const d = custData(c); res.push(...d.res); quotes.push(...d.quotes); }
  const uniq = a => [...new Map(a.map(x => [x.id, x])).values()];

  const openInv = invs.filter(i => i.type !== "credit" && !i.paidOn && !i.creditedBy);

const sxMgr = q => (typeof mgrOfQuote === "function" ? mgrOfQuote(q) : q.manager || (q.reservationId && S.reservations.get(q.reservationId)?.manager) || "");

/* Managers */
function vStatManagers() {
  const { from, to, label } = statRange(), inR = d => d && d >= from && d <= to;
  const made = [...S.quotes.values()].filter(q => inR(sxMade(q)));

  }).filter(x => x.m || x.n || x.omzet || x.optie);

// "10:00" blijft 10:00; "-2:00" is 2 uur voor de eerste wedstrijd; "+0:30" is een half uur na de laatste wedstrijd.
function ssTime(expr, A) {

// Zonder getal: Heren 1 standaard 400 (Michel: Heren 1 thuis trekt het meeste publiek), andere topteams het getal bij "Topteam".

function ssTopTeams() {

  if (!ssDraft || ssDraft.date !== "sjabloon") ssDraft = { date: "sjabloon", teams: T.teams, draaiboek: structuredClone(T.draaiboek || []), taken: structuredClone(T.taken || []) };
  const D = ssDraft;
  const tRows = D.taken.length ? D.taken.map((x, i) => `<div class="ss-row" data-ssk="taken" data-ssi="${i}"><input data-f="text" value="${esc(x.text)}" aria-label="Taak" ${ro}><input type="number" data-f="dagen" value="${esc(x.dagen ?? "")}" style="width:90px;flex:none" aria-label="Dagen ervoor of erna" ${ro}><span class="small muted" style="flex:none">dagen</span><button type="button" class="btn ghost" data-ssdel="taken:${i}" aria-label="Verwijderen" ${ro}>✕</button></div>`).join("") : `<p class="small muted" style="margin:0">Geen standaardtaken.</p>`;
  return `<section class="stack">
    <div class="row spread"><div class="row"><button class="btn" id="ss-back" aria-label="Terug naar Super Sundays">‹</button><h2>Standaard voor elke Super Sunday</h2></div><button class="btn bar" id="ss-save" ${ro}>Opslaan</button></div>
    <div class="panel stack" style="gap:6px"><h3>Welke teams</h3>
      <label class="f"><span>Teams die allebei thuis moeten spelen (komma's)</span><input id="ss-teams" value="${esc(D.teams || "")}" ${ro}></label>
      <p class="small muted" style="margin:0">LISA-namen als D01 en H01 worden vanzelf herkend als Dames 1 en Heren 1.</p></div>
    <div class="panel stack" style="gap:6px"><div class="row spread"><h3>Standaard draaiboek</h3><button type="button" class="btn" data-ssadd="draaiboek" ${ro}>+ Punt</button></div>
      <p class="small muted" style="margin:0">Gebruik -2:00 voor "2 uur voor de eerste wedstrijd" en +0:30 voor "een half uur na de laatste wedstrijd", of een vaste tijd zoals 10:00.</p>
      <div class="stack" style="gap:6px">${ssRowsHtml("draaiboek", D.draaiboek, null, ro)}</div></div>
    <div class="panel stack" style="gap:6px"><div class="row spread"><h3>Standaardtaken</h3><button type="button" class="btn" data-ssadd="taken" ${ro}>+ Taak</button></div>
      <p class="small muted" style="margin:0">Aantal dagen voor (-7) of na (1) de Super Sunday dat de taak klaar moet zijn.</p>
      <div class="stack" style="gap:6px">${tRows}</div></div>
    <p class="small muted">Wijzigingen gelden voor Super Sundays waarvan het draaiboek nog niet is opgeslagen.</p>
  </section>`;
}
function afterSSTpl() {
  const D = ssDraft, sync = () => ssSyncDraft(D);
  $("#ss-back").onclick = () => { S.ssOpen = null; ssDraft = null; render(); };
  document.querySelectorAll(".ss-row input, #ss-teams").forEach(el => el.addEventListener("input", sync));
  document.querySelectorAll("[data-ssadd]").forEach(b => b.onclick = () => { sync(); D[b.dataset.ssadd].push(b.dataset.ssadd === "taken" ? { text: "", dagen: -7 } : SS_ROWS.draaiboek.add()); render(); });
  document.querySelectorAll("[data-ssdel]").forEach(b => b.onclick = () => { sync(); const [k, i] = b.dataset.ssdel.split(":"); D[k].splice(+i, 1); render(); });
  $("#ss-save").onclick = async () => {
    sync();
    const body = { teams: (D.teams || "").trim() || SS_DEFAULT.teams, draaiboek: D.draaiboek.filter(x => x.time || x.text).map(({ time, text, wie }) => ({ time: time || "", text: text || "", wie: wie || "" })), taken: D.taken.filter(x => x.text).map(x => ({ text: x.text, dagen: x.dagen === "" || x.dagen == null ? 0 : +x.dagen })), updatedAt: new Date().toISOString() };
    if (await write("supersundays/sjabloon", body)) { ssDraft = null; toast("Standaard opgeslagen"); S.ssOpen = null; render(); }
  };
}

// Afdrukbaar draaiboek: wedstrijden en draaiboek samen op tijd, daarna afspraken, taken en notities.
function ssSheet(date, D) {
  const A = ssAnchor(date), keys = ssTeamKeys();
  const rows = [...homeMatches(date).map(m => ({ sort: toMin(m.time) ?? 9998, t: m.time || "tijd volgt", text: `<b>Wedstrijd ${esc(m.team)}${m.opponent ? " – " + esc(m.opponent) : ""}</b>${m.field ? " (" + esc(m.field) + ")" : ""}`, wie: "", match: keys.includes(ssTeamKey(m.team)) })),
    ...(D.draaiboek || []).map(x => { const t = ssTime(x.time, A); return { sort: t.sort, t: t.abs || (t.rel ? "tijd volgt" : ""), sub: t.rel, text: esc(x.text), wie: esc(x.wie || "") }; })]
    .sort((a, b) => a.sort - b.sort);
  return `<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Draaiboek Super Sunday ${esc(date)}</title>
<style>body{font-family:"Open Sans",Arial,sans-serif;font-size:14px;color:#3b3b3b;max-width:760px;margin:32px auto;padding:0 24px;line-height:1.5}h1,h2{font-weight:600;margin:0 0 6px}h1{color:#e5621c}h2{font-size:1.1rem;margin-top:22px;color:#1b7d88;border-bottom:2px solid #1b7d88;padding-bottom:3px}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e3e3e3;text-align:left;vertical-align:top}.k{width:90px;font-weight:600;white-space:nowrap}.s{color:#8a8a8a;font-size:12px}.box{border:2px solid #b3352b;padding:8px 12px;border-radius:6px}@media print{body{margin:0}}</style></head><body>
<h1>Draaiboek Super Sunday</h1><p style="font-size:1.2rem;margin:0"><b>${esc(longDate(date))}</b></p>
<p class="box">Alle ruimtes zijn deze dag geblokkeerd: geen reserveringen.</p>
<h2>Programma</h2>${rows.length ? `<table>${rows.map(r => `<tr${r.match ? ' style="background:#d2e8e6"' : ""}><td class="k">${esc(r.t)}${r.sub ? `<br><span class="s">${esc(r.sub)}</span>` : ""}</td><td>${r.text}</td><td>${r.wie}</td></tr>`).join("")}</table>` : "<p>Nog geen programma.</p>"}
${(D.afspraken || []).length ? `<h2>Afspraken</h2><table><tr><th>Afspraak</th><th>Met</th><th>Contact</th><th>Status</th></tr>${D.afspraken.map(a => `<tr><td>${esc(a.wat)}</td><td>${esc(a.met)}</td><td>${esc(a.contact)}</td><td>${esc(a.status)}</td></tr>`).join("")}</table>` : ""}
${(D.taken || []).length ? `<h2>Taken</h2><table>${D.taken.map(t => `<tr><td class="k">${t.done ? "✓" : "☐"}</td><td>${esc(t.text)}</td><td>${t.due ? esc(shortDate(t.due)) : ""}</td></tr>`).join("")}</table>` : ""}
${(D.notities || "").trim() ? `<h2>Notities</h2><p>${esc(D.notities).replace(/\n/g, "<br>")}</p>` : ""}
<p style="color:#8a8a8a;margin-top:28px">Gemaakt ${esc(new Date().toLocaleString("nl-NL"))} · HC Tilburg Horeca</p></body></html>`;
}

/* Menu en stijl */
(() => {
  const ag = MENU.find(m => m.id === "agenda"); if (!ag || ag.items.some(it => it.v === "supersunday")) return;
  const at = ag.items.findIndex(it => it.sep);
  ag.items.splice(at < 0 ? ag.items.length : at, 0, { l: "Super Sundays", v: "supersunday", set: { ssOpen: null } });
  document.head.insertAdjacentHTML("beforeend", `<style id="ss-style">
.ss-band { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: var(--r); background: var(--orange-soft); border: 1px solid var(--orange); border-left: 6px solid var(--orange); color: var(--fg); }
.ss-band .ss-h { display: flex; gap: 12px; align-items: flex-start; min-width: 0; flex: 1 1 320px; }
.ss-star { font-size: 1.6rem; line-height: 1; color: var(--orange); }
.ss-t { color: var(--orange); font-size: 1.05rem; }
.ss-band.ss-off { background: var(--sunk); border-color: var(--line); border-left-color: var(--muted); }
.day .ln.ss { color: var(--orange); font-weight: 700; }
.day .ln.top { color: var(--teal); font-weight: 600; }
.ss-band.ss-top { background: var(--teal-soft); border-color: var(--teal); border-left-color: var(--teal); }
.ss-band.ss-top .ss-star, .ss-band.ss-top .ss-t { color: var(--teal); }
.ss-row { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
.ss-row .ss-abs { flex: none; min-width: 64px; }
@media (max-width: 640px) { .ss-row { flex-wrap: wrap; } .ss-row input[data-f="text"], .ss-row input[data-f="wat"] { flex: 1 1 100%; order: -1; } }
</style>`);
})();
boot();
})();
</script>
