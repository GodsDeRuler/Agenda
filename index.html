(function () {
  "use strict";
  const CFG = window.HCT_SUPABASE || {};
  const sb = window.supabase.createClient(CFG.url, CFG.key, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });

  /* ---------- toegang ---------- */
  const T = { user: null, rol: null, naam: "" };
  let klaar; const klaarP = new Promise(r => (klaar = r));
  let opgestart = false;

  const css = `
.sb-scrim{position:fixed;inset:0;z-index:90;background:var(--bg,#f3f5f4);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(48px + env(safe-area-inset-top,0px)) 16px 40px}
.sb-card{width:100%;max-width:380px;background:var(--surface,#fff);border:1px solid var(--line,#d3dad7);border-radius:var(--r,6px);padding:20px;color:var(--fg,#16211d);font-family:var(--body,system-ui)}
.sb-card h1{font-family:var(--display,system-ui);font-size:26px;margin:0 0 4px;letter-spacing:.01em}
.sb-card p{margin:0 0 14px;color:var(--muted,#5b6863);font-size:14px}
.sb-card label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.sb-card input,.sb-card select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line,#d3dad7);border-radius:var(--r,6px);background:var(--surface,#fff);color:inherit}
.sb-card button{font:inherit;font-weight:600;padding:9px 14px;border-radius:var(--r,6px);border:1px solid var(--line,#d3dad7);background:var(--sunk,#e8ecea);color:inherit;cursor:pointer}
.sb-card button.sb-hoofd{background:var(--teal,var(--pitch,#0f6b4f));border-color:var(--teal,var(--pitch,#0f6b4f));color:#fff;width:100%;margin-top:16px}
.sb-card .sb-rij{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sb-card .sb-link{background:none;border:0;padding:4px 0;color:var(--teal,var(--pitch,#0f6b4f));font-weight:500;text-decoration:underline}
.sb-msg{margin-top:12px;font-size:14px;padding:8px 10px;border-radius:var(--r,6px);background:var(--warn-soft,#f7ebd2)}
.sb-msg.ok{background:var(--ok-soft,#dcefe2)}
.sb-acc{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;font:600 13px var(--body,system-ui);padding:7px 11px;border-radius:999px;border:1px solid var(--line,#d3dad7);background:var(--surface,#fff);color:var(--fg,#16211d);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sb-leden{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.sb-leden td{padding:6px 4px;border-top:1px solid var(--line,#d3dad7);vertical-align:middle}
.sb-leden select{padding:4px 6px}
.sb-wide{max-width:560px}`;
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let scherm = null;
  function toon(html) {
    if (!scherm) { scherm = document.createElement("div"); scherm.className = "sb-scrim"; document.body.appendChild(scherm); }
    scherm.innerHTML = html; scherm.hidden = false;
    return scherm;
  }
  function verberg() { if (scherm) scherm.hidden = true; }
  function melding(el, tekst, ok) { const m = el.querySelector(".sb-msg"); if (m) { m.textContent = tekst; m.className = "sb-msg" + (ok ? " ok" : ""); m.hidden = !tekst; } }

  function inlogScherm(tekst = "") {
    const el = toon(`<form class="sb-card" novalidate>
      <h1>Horeca-agenda</h1><p>HC Tilburg · Inloggen</p>
      <label for="sb-mail">E-mailadres</label><input id="sb-mail" type="email" autocomplete="username" required>
      <label for="sb-pw">Wachtwoord</label><input id="sb-pw" type="password" autocomplete="current-password" required>
      <button class="sb-hoofd" type="submit">Inloggen</button>
      <div class="sb-msg" hidden></div>
      <p style="margin:14px 0 0">Nog geen account of wachtwoord vergeten? Vraag de beheerder van de agenda.</p></form>`);
    if (tekst) melding(el, tekst);
    const form = el.querySelector("form");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const knop = form.querySelector(".sb-hoofd"); knop.disabled = true;
      try {
        const { error } = await sb.auth.signInWithPassword({ email: form.querySelector("#sb-mail").value.trim().toLowerCase(), password: form.querySelector("#sb-pw").value });
        if (error) throw error;
        await naInloggen();
      } catch (err) { melding(el, vertaal(err)); }
      finally { knop.disabled = false; }
    });
    setTimeout(() => form.querySelector("input")?.focus(), 0);
  }

  function vertaal(err) {
    const m = String(err && err.message || err || "");
    if (/invalid login credentials/i.test(m)) return "E-mailadres of wachtwoord klopt niet.";
    if (/email not confirmed/i.test(m)) return "Je hebt je e-mailadres nog niet bevestigd. Klik eerst op de link in de mail.";
    if (/already registered|already been registered/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Log in of kies 'Wachtwoord vergeten'.";
    if (/rate limit|too many/i.test(m)) return "Te veel pogingen of mails kort na elkaar. Probeer het over een uur opnieuw.";
    if (/password/i.test(m) && /least|short|weak/i.test(m)) return "Kies een langer of sterker wachtwoord.";
    if (/fetch|network/i.test(m)) return "Geen verbinding. Controleer je internet en probeer opnieuw.";
    return m || "Er ging iets mis. Probeer het opnieuw.";
  }

  async function naInloggen() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return inlogScherm();
    T.user = user;
    const { data, error } = await sb.from("agenda_leden").select("rol,naam").eq("email", (user.email || "").toLowerCase()).maybeSingle();
    if (error || !data) {
      const el = toon(`<div class="sb-card"><h1>Horeca-agenda</h1>
        <p>Je bent ingelogd als <b>${esc(user.email)}</b>, maar dit adres heeft nog geen toegang tot de agenda.</p>
        <p>Vraag de beheerder om je e-mailadres toe te voegen en herlaad daarna deze pagina.</p>
        <div class="sb-rij"><button type="button" data-a="opnieuw">Opnieuw proberen</button><button type="button" data-a="uit">Uitloggen</button></div></div>`);
      el.querySelector('[data-a="opnieuw"]').onclick = naInloggen;
      el.querySelector('[data-a="uit"]').onclick = uitloggen;
      return;
    }
    T.rol = data.rol; T.naam = data.naam || "";
    verberg();
    accountKnop();
    if (!opgestart) { opgestart = true; startLive(); klaar(); }
  }

  async function uitloggen() { await sb.auth.signOut(); location.reload(); }

  function accountKnop() {
    const naam = T.naam || T.user.email;
    const who = document.querySelector("header .who");
    if (who) {
      const t = who.querySelector("span"); if (t) t.textContent = naam;
      who.setAttribute("role", "button"); who.tabIndex = 0; who.title = "Account en toegang";
      who.style.cursor = "pointer";
      who.onclick = () => accountScherm();
      who.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); accountScherm(); } };
    }
    // Losse knop rechtsonder als de kop geen (zichtbare) gebruikersplek heeft, zoals op een telefoon.
    let k = document.querySelector(".sb-acc");
    if (!k) {
      k = document.createElement("button"); k.type = "button"; k.className = "sb-acc"; document.body.appendChild(k); k.onclick = () => accountScherm();
      const zet = () => { const w = document.querySelector("header .who"); k.hidden = !!(w && w.offsetParent !== null); };
      addEventListener("resize", zet); zet();
    }
    k.textContent = naam;
  }

  async function ledenActie(invoer) {
    const { data, error } = await sb.functions.invoke("agenda-lid", { body: invoer });
    if (error) {
      let tekst = error.message;
      try { const j = await error.context.json(); if (j && j.fout) tekst = j.fout; } catch (e) {}
      throw new Error(tekst);
    }
    return data;
  }
  function nieuwWachtwoord() {
    const t = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const r = crypto.getRandomValues(new Uint32Array(10));
    return Array.from(r, x => t[x % t.length]).join("");
  }

  async function accountScherm(tekst = "", ok = false) {
    const beheer = T.rol === "beheer";
    const ik = (T.user.email || "").toLowerCase();
    let rijen = "";
    if (beheer) {
      const { data } = await sb.from("agenda_leden").select("email,naam,rol").order("email");
      rijen = (data || []).map(l => `<tr data-mail="${esc(l.email)}"><td>${esc(l.naam || "")}<br><small>${esc(l.email)}</small></td>
        <td><select data-rol ${l.email === ik ? "disabled" : ""}>${["lezen", "schrijven", "beheer"].map(r => `<option ${r === l.rol ? "selected" : ""}>${r}</option>`).join("")}</select></td>
        <td>${l.email === ik ? "" : `<button type="button" data-pw>Nieuw wachtwoord</button> <button type="button" data-weg>Verwijder</button>`}</td></tr>`).join("");
    }
    const el = toon(`<div class="sb-card ${beheer ? "sb-wide" : ""}"><h1>Account</h1>
      <p>Ingelogd als <b>${esc(T.user.email)}</b> · rechten: ${esc(T.rol)}</p>
      <form data-eigen class="sb-rij" style="align-items:flex-end">
        <div style="flex:1 1 200px"><label>Eigen wachtwoord wijzigen</label><input type="password" name="pw" autocomplete="new-password" minlength="8" placeholder="Minstens 8 tekens"></div>
        <button type="submit">Opslaan</button></form>
      ${beheer ? `<h2 style="font-size:16px;margin:20px 0 4px">Wie heeft toegang</h2>
        <p>Een nieuw account krijgt een startwachtwoord. Geef dat zelf door; de persoon kan het daarna hier wijzigen.</p>
        <table class="sb-leden">${rijen}</table>
        <form data-nieuw class="sb-rij" style="align-items:flex-end">
          <div style="flex:2 1 180px"><label>E-mailadres</label><input type="email" name="mail" required></div>
          <div style="flex:1 1 110px"><label>Naam</label><input name="naam"></div>
          <div style="flex:1 1 110px"><label>Rechten</label><select name="rol"><option>schrijven</option><option>lezen</option><option>beheer</option></select></div>
          <button type="submit">Account maken</button></form>` : ""}
      <div class="sb-msg" hidden></div>
      <div class="sb-rij" style="margin-top:18px"><button type="button" data-a="terug">Terug naar de agenda</button><button type="button" data-a="uit">Uitloggen</button></div></div>`);
    if (tekst) melding(el, tekst, ok);
    el.querySelector('[data-a="terug"]').onclick = verberg;
    el.querySelector('[data-a="uit"]').onclick = uitloggen;
    el.querySelector("[data-eigen]").onsubmit = async e => {
      e.preventDefault();
      const pw = e.target.pw.value;
      if (pw.length < 8) return melding(el, "Kies een wachtwoord van minstens 8 tekens.");
      const { error } = await sb.auth.updateUser({ password: pw });
      e.target.pw.value = "";
      melding(el, error ? "Wijzigen mislukt: " + vertaal(error) : "Je nieuwe wachtwoord is opgeslagen.", !error);
    };
    if (!beheer) return;
    el.querySelectorAll("tr[data-mail]").forEach(tr => {
      const mail = tr.dataset.mail;
      tr.querySelector("[data-rol]").onchange = async e => {
        const { error } = await sb.from("agenda_leden").update({ rol: e.target.value }).eq("email", mail);
        melding(el, error ? "Wijzigen mislukt: " + vertaal(error) : "Rechten aangepast.", !error);
      };
      const pw = tr.querySelector("[data-pw]");
      if (pw) pw.onclick = async () => {
        const nieuw = nieuwWachtwoord();
        if (!confirm(`Nieuw wachtwoord instellen voor ${mail}?`)) return;
        try { await ledenActie({ actie: "wachtwoord", email: mail, wachtwoord: nieuw }); melding(el, `Nieuw wachtwoord voor ${mail}: ${nieuw}  (geef dit door; het wordt niet bewaard)`, true); }
        catch (err) { melding(el, "Mislukt: " + err.message); }
      };
      const weg = tr.querySelector("[data-weg]");
      if (weg) weg.onclick = async () => {
        if (!confirm(`Account en toegang van ${mail} verwijderen?`)) return;
        try { await ledenActie({ actie: "verwijderen", email: mail }); accountScherm(`${mail} heeft geen toegang meer.`, true); }
        catch (err) { melding(el, "Verwijderen mislukt: " + err.message); }
      };
    });
    el.querySelector("[data-nieuw]").onsubmit = async e => {
      e.preventDefault();
      const f = e.target, mail = f.mail.value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return melding(el, "Vul een geldig e-mailadres in.");
      const nieuw = nieuwWachtwoord();
      try {
        await ledenActie({ actie: "toevoegen", email: mail, naam: f.naam.value.trim(), rol: f.rol.value, wachtwoord: nieuw });
        accountScherm(`Account gemaakt voor ${mail}. Startwachtwoord: ${nieuw}  (geef dit door; het wordt niet bewaard)`, true);
      } catch (err) { melding(el, "Account maken mislukt: " + err.message); }
    };
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") { if (opgestart) location.reload(); else inlogScherm(); return; }
  });
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) naInloggen(); else inlogScherm();
  })();

  /* ---------- documentopslag ---------- */
  const cache = new Map();      // collectie -> Map(id -> data)
  const laden = new Map();      // collectie -> Promise
  const luisteraars = new Set(); // { col, id|null, cb, err }
  const kopie = v => (v == null ? v : JSON.parse(JSON.stringify(v)));

  function fout(e) {
    const code = e && (e.code === "42501" || e.status === 401 || e.status === 403) ? "invalid_argument" : "unavailable";
    const f = new Error(e && e.message || "Opslaan mislukt"); f.code = code; return f;
  }
  async function laadCollectie(col) {
    const m = new Map();
    for (let van = 0; ; van += 1000) {
      const { data, error } = await sb.from("agenda_docs").select("id,data").eq("collectie", col).order("id").range(van, van + 999);
      if (error) throw fout(error);
      data.forEach(r => m.set(r.id, r.data));
      if (data.length < 1000) break;
    }
    cache.set(col, m);
    return m;
  }
  function zorgVoor(col) {
    if (!laden.has(col)) laden.set(col, laadCollectie(col).catch(e => { laden.delete(col); throw e; }));
    return laden.get(col);
  }
  function docSnap(col, id) {
    const d = cache.get(col)?.get(id);
    return { id, exists: d !== undefined, data: () => kopie(d), get: k => kopie(d?.[k]) };
  }
  function colSnap(col) {
    const docs = [...(cache.get(col) || new Map()).keys()].map(id => docSnap(col, id));
    return { docs, size: docs.length, empty: docs.length === 0, forEach: f => docs.forEach(f) };
  }
  function meld(col) {
    luisteraars.forEach(l => { if (l.col !== col) return; try { l.cb(l.id == null ? colSnap(col) : docSnap(col, l.id)); } catch (e) { console.error(e); } });
  }
  function luister(col, id, cb, err) {
    const l = { col, id, cb, err };
    luisteraars.add(l);
    zorgVoor(col).then(() => luisteraars.has(l) && cb(id == null ? colSnap(col) : docSnap(col, id)), e => err && err(e));
    return () => luisteraars.delete(l);
  }

  let kanaal = null;
  function startLive() {
    kanaal = sb.channel("agenda-docs")
      .on("postgres_changes", { event: "*", schema: "public", table: "agenda_docs" }, p => {
        const rec = p.eventType === "DELETE" ? p.old : p.new;
        const m = rec && cache.get(rec.collectie);
        if (!m) return;
        if (p.eventType === "DELETE") m.delete(rec.id); else m.set(rec.id, rec.data);
        meld(rec.collectie);
      })
      .subscribe(status => { if (status === "SUBSCRIBED") herlaadAlles(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") herlaadAlles(); });
  }
  async function herlaadAlles() {
    for (const col of [...cache.keys()]) { try { await laadCollectie(col); meld(col); } catch (e) {} }
  }
  function lokaal(col, id, data) {
    const m = cache.get(col); if (!m) return;
    if (data === undefined) m.delete(id); else m.set(id, data);
    meld(col);
  }

  function docRef(col, id) {
    return {
      id, path: col + "/" + id,
      onSnapshot: (cb, err) => luister(col, id, cb, err),
      get: async () => {
        if (cache.has(col)) return docSnap(col, id);
        // Losse lezing (bijv. backups/<id>): alleen dit ene document ophalen, niet de hele collectie.
        const { data, error } = await sb.from("agenda_docs").select("data").eq("collectie", col).eq("id", id).maybeSingle();
        if (error) throw fout(error);
        const d = data ? data.data : undefined;
        return { id, exists: d !== undefined, data: () => kopie(d), get: k => kopie(d?.[k]) };
      },
      set: async data => {
        const schoon = kopie(data);
        const { error } = await sb.from("agenda_docs").upsert({ collectie: col, id, data: schoon });
        if (error) throw fout(error);
        lokaal(col, id, schoon);
      },
      update: async data => {
        const { data: res, error } = await sb.rpc("agenda_doc_update", { p_collectie: col, p_id: id, p_velden: kopie(data) });
        if (error) throw fout(error);
        lokaal(col, id, res);
      },
      delete: async () => {
        const { error } = await sb.from("agenda_docs").delete().eq("collectie", col).eq("id", id);
        if (error) throw fout(error);
        lokaal(col, id, undefined);
      },
    };
  }
  function colRef(col) {
    return {
      id: col, path: col,
      doc: id => docRef(col, id ?? (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2))),
      onSnapshot: (cb, err) => luister(col, null, cb, err),
      get: async () => { await zorgVoor(col); return colSnap(col); },
    };
  }
  function splits(pad) { const d = String(pad).split("/").filter(Boolean); return d; }
  const db = Object.freeze({
    doc: pad => { const d = splits(pad); return docRef(d.slice(0, -1).join("/"), d[d.length - 1]); },
    collection: pad => colRef(splits(pad).join("/")),
  });

  /* ---------- gebruiker en downloads ---------- */
  const gebruiker = Object.freeze({
    isOwner: () => T.rol === "beheer",
    canEdit: () => T.rol === "beheer",
    can: async naam => (naam === "data.write" ? T.rol === "schrijven" || T.rol === "beheer" : null),
    id: async () => T.user?.id,
    me: async () => ({ id: T.user?.id, name: T.naam || T.user?.email || "", email: T.user?.email }),
    profiles: async ids => Object.fromEntries((ids || []).map(i => [i, { id: i, name: "" }])),
  });
  const MIME = { html: "text/html", csv: "text/csv", json: "application/json", txt: "text/plain", ics: "text/calendar", pdf: "application/pdf", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" };
  const downloads = Object.freeze({
    save: async ({ filename, data, mimeType }) => {
      const ext = String(filename || "").split(".").pop().toLowerCase();
      const blob = data instanceof Blob ? data : new Blob([data], { type: mimeType || MIME[ext] || "application/octet-stream" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename || "download";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return { saved: true };
    },
  });

  window.claude = Object.freeze({
    use: async naam => {
      if (naam === "downloads") return downloads;
      if (naam === "db") { await klaarP; return db; }
      if (naam === "user") { await klaarP; return gebruiker; }
      return null;
    },
  });
  /* ---------- foto's (alleen in de webversie) ----------
   * hctFotoUpload(file, map) zet een afbeelding in de publieke bucket "ruimte-fotos" en geeft de publieke url terug.
   * hctFotoVerwijder(url) haalt een eerder geüploade foto weg. Fouten krijgen dezelfde codes als de db. */
  const BUCKET = "ruimte-fotos";
  window.hctFotoUpload = async (file, map = "algemeen") => {
    await klaarP;
    if (!(file instanceof Blob) || !/^image\/(jpeg|png|webp)$/.test(file.type)) { const f = new Error("Alleen jpg, png of webp"); f.code = "invalid_argument"; throw f; }
    if (file.size > 5 * 1024 * 1024) { const f = new Error("Foto is groter dan 5 MB"); f.code = "invalid_argument"; throw f; }
    const ext = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" }[file.type];
    const pad = `${String(map).replace(/[^a-z0-9_-]/gi, "-")}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(pad, file, { contentType: file.type, cacheControl: "31536000", upsert: false });
    if (error) throw fout({ ...error, status: +error.statusCode || error.status });
    return sb.storage.from(BUCKET).getPublicUrl(pad).data.publicUrl;
  };
  window.hctFotoVerwijder = async url => {
    await klaarP;
    const pre = sb.storage.from(BUCKET).getPublicUrl("").data.publicUrl;
    if (!String(url || "").startsWith(pre)) return false; // geen foto uit onze bucket: niets te doen
    const { error } = await sb.storage.from(BUCKET).remove([decodeURIComponent(url.slice(pre.length))]);
    if (error) throw fout({ ...error, status: +error.statusCode || error.status });
    return true;
  };

  window.HCT_SB = sb; // handig voor beheer via de browserconsole
})();

</script>
<script>
(() => {
"use strict";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

async function write(path, data, mode = "set") {
  if (!S.db) { toast("Opslag niet beschikbaar: wijziging alleen lokaal zichtbaar"); localApply(path, data, mode); render(); return true; }
  try {
    const ref = S.db.doc(path);
    if (mode === "delete") await ref.delete(); else await ref[mode](data);
    return true;
  } catch (e) {
    if (e && e.code === "invalid_argument") { S.readOnly = true; toast("Je hebt alleen leesrechten op deze agenda"); render(); }
    else if (e && e.code === "quota_exceeded") toast("Opslag is vol: verwijder oude gegevens");

    return false;
  }
}
function localApply(path, data, mode) {
  const [col, id] = path.split("/");

}

  const tops = String(S.settings.drukte.topTeams || "").split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
  if (tops.some(x => new RegExp("(^|\\W)" + x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\W|$)").test(t))) return "top";

function crowd(date) {
  const D = S.settings.drukte, dur = +D.duur || 105;
  const ms = homeMatches(date);
  let total = 0; const slots = new Array(48).fill(0);
  for (const m of ms) {
    const v = +D[classify(m.team)] || 0; total += v;
    const s = toMin(m.time); if (s == null) continue;

function conflicts(r) {
  const out = { hard: [], soft: [] };
  const s = toMin(r.start), e = toMin(r.end) ?? (s + 180);
  if (s == null || !r.roomId || r.status === "geannuleerd") return out;
  const e2 = e <= s ? e + 1440 : e;
  for (const o of resOn(r.date)) {
    if (o.id === r.id || !roomsClash(o.roomId, r.roomId)) continue;
    const os = toMin(o.start), oe0 = toMin(o.end) ?? os + 180, oe = oe0 <= os ? oe0 + 1440 : oe0;

  }
  const rm = room(r.roomId);
  for (const ev of clubOn(r.date)) {
    if (!clubMentionsRoom(ev, rm)) continue;
    const os = ev.allDay ? 0 : toMin(ev.start), oe = ev.allDay ? 1440 : (toMin(ev.end) ?? os + 60);

}

  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    cells.push(d);
  }
  const noData = S.matchDays.size === 0 && S.clubMonths.size === 0 && S.reservations.size === 0;
  let mCount = 0, rCount = 0, busy = 0;
  const html = cells.map(d => {
    const ds = iso(d), inM = d.getMonth() === m - 1;
    const c = crowd(ds), rs = resOn(ds), cl = clubOn(ds);
    if (inM) { mCount += c.count; rCount += rs.length; if (c.lvl >= 2) busy++; }
    const lines = [];
    if (c.count) lines.push(`<div class="ln m">${c.count} thuiswedstr.</div>`);
    rs.slice(0, 3).forEach(r => lines.push(`<div class="ln r"><span class="dot" style="background:${esc(room(r.roomId)?.color || "var(--bar)")}"></span>${esc(r.start || "")} ${esc(r.customer || "Reservering")}</div>`));
    if (rs.length > 3) lines.push(`<div class="ln r muted">+${rs.length - 3} meer</div>`);
    if (cl.length) lines.push(`<div class="ln c">${cl.length} in clubagenda</div>`);
    lines.push(...blockLines(ds)); lines.push(...apptLines(ds));
    const sum = `<div class="ln sum">${c.count ? `<span class="dot" style="background:var(--pitch)"></span>` : ""}${rs.length ? `<span class="dot" style="background:var(--bar)"></span>` : ""}${cl.length ? `<span class="dot" style="background:var(--club)"></span>` : ""}</div>`;
    return `<button class="day ${inM ? "" : "out"} ${ds === todayISO ? "today" : ""}" data-day="${ds}" aria-label="${esc(longDate(ds))}">
      <div class="dn num"><span>${d.getDate()}</span>${c.total ? `<span class="chip c${c.lvl}" title="Verwachte bezoekers">${c.total}</span>` : ""}</div>
      ${lines.join("")}${sum}</button>`;
  }).join("");
  return `
  <section class="stack">
    <div class="row spread">
      <div class="row">
        <button class="btn" id="m-prev" aria-label="Vorige maand">‹</button>
        <h2 style="min-width:12ch">${MONTHS[m - 1]} ${y}</h2>
        <button class="btn" id="m-next" aria-label="Volgende maand">›</button>
        <button class="btn ghost" id="m-today">Vandaag</button>
      </div>
      <button class="btn bar" id="m-new" ${S.readOnly ? "disabled" : ""}>Nieuwe reservering</button>
    </div>
    <div class="row small muted num">${mCount} thuiswedstrijden · ${rCount} horeca-reserveringen · ${busy} drukke dagen deze maand</div>
    ${noData ? `<div class="panel stack"><h3>Nog leeg: zo vul je de agenda</h3><ol class="steps"><li>Zet onder <b>Instellingen</b> jullie ruimtes en arrangementen goed.</li><li>Importeer onder <b>Importeren</b> de wedstrijden uit LISA (Excel) en de clubagenda uit Outlook (.ics).</li><li>Voeg feestjes en borrels toe met <b>Nieuwe reservering</b>. De agenda waarschuwt bij dubbele boekingen.</li></ol></div>` : ""}
    <div>
      <div class="cal-head">${DAYS_SHORT.map(x => `<div>${x}</div>`).join("")}</div>
      <div class="cal">${html}</div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--pitch)"></span> Wedstrijden (LISA)</span>
      <span><span class="dot" style="background:var(--bar)"></span> Horeca-reserveringen</span>
      <span><span class="dot" style="background:var(--club)"></span> Clubagenda (Outlook)</span>
      <span><span class="chip c1">120</span> <span class="chip c2">450</span> <span class="chip c3">900</span> verwachte bezoekers</span>
    </div>
  </section>`;
}
after.agenda = () => {
  const mv = n => { const [y, m] = S.month.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); S.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); };
  $("#m-prev").onclick = () => mv(-1); $("#m-next").onclick = () => mv(1);
  $("#m-today").onclick = () => { S.month = todayISO.slice(0, 7); render(); };
  $("#m-new").onclick = () => openRes({ date: todayISO });
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { S.day = b.dataset.day; setView("dag"); });
};

/* Dag */
function vDag() {
  const d = S.day, c = crowd(d), ms = matchesOn(d), rs = resOn(d), cl = clubOn(d);
  const H0 = 8 * 60, H1 = 24 * 60, span = H1 - H0;
  const pos = (s, e) => { const a = Math.max(H0, s), b = Math.min(H1, e); return `left:${((a - H0) / span * 100).toFixed(2)}%;width:${Math.max(.8, (b - a) / span * 100).toFixed(2)}%`; };
  const hours = []; for (let h = 8; h <= 24; h += 2) hours.push(h);
  const gridL = hours.map(h => `<span class="grid-l" style="left:${((h * 60 - H0) / span * 100).toFixed(2)}%"></span>`).join("");
  const nowLine = d === todayISO ? (() => { const n = new Date(), mm = n.getHours() * 60 + n.getMinutes(); return mm >= H0 ? `<span class="blk now" style="left:${((mm - H0) / span * 100).toFixed(2)}%"></span>` : ""; })() : "";
  const maxSlot = Math.max(1, ...c.slots);
  const dens = c.slots.map((v, i) => v && i * 30 >= H0 ? `<span class="blk dens" style="${pos(i * 30, i * 30 + 30)};height:${Math.round(v / maxSlot * 100)}%;opacity:${(.15 + .6 * v / maxSlot).toFixed(2)}"></span>` : "").join("");
  const roomRows = S.settings.rooms.map(rm => {
    const blocks = rs.filter(r => r.roomId === rm.id && !(r.dagindeling || []).length).map(r => { const s = toMin(r.start) ?? H0, e0 = toMin(r.end) ?? s + 180, e = e0 <= s ? 1440 : e0; return `<span class="blk res ${r.status === "optie" || r.status === "aanvraag" ? "optie" : ""}" data-res="${esc(r.id)}" style="${pos(s, e)}" title="${esc(r.customer)} ${esc(r.start)}–${esc(r.end)}">${esc(r.start)} ${esc(r.customer || "")}${r.persons ? " · " + esc(r.persons) + "p" : ""}</span>`; }).join("");
    const cblocks = cl.filter(ev => clubMentionsRoom(ev, rm)).map(ev => { const s = ev.allDay ? H0 : toMin(ev.start), e = ev.allDay ? H1 : (toMin(ev.end) ?? s + 60); return `<span class="blk club" style="${pos(s, e)}" title="${esc(ev.title)}">${esc(ev.title)}</span>`; }).join("");
    const busy = rs.some(r => resParts(r).some(p => roomsClash(p.roomId, rm.id))) || blocksOn(d).some(b => blockRooms(b).includes(rm.id)) || cl.some(ev => clubMentionsRoom(ev, rm));
    return `<div class="lab"><b><span class="dot" style="background:${esc(rm.color || "var(--bar)")}"></span> ${esc(rm.name)}</b><span class="muted small">${busy ? "deels bezet" : "hele dag vrij"}${rm.capacity ? " · max " + esc(rm.capacity) : ""}</span></div><div class="track">${gridL}${cblocks}${blocks}${dagTimelineExtra(rm, d, pos)}${nowLine}</div>`;
  }).join("");
  const unmatched = cl.filter(ev => !S.settings.rooms.some(rm => clubMentionsRoom(ev, rm)));
  return `
  <section class="stack">
    <div class="row spread">
      <div class="row">
        <button class="btn" id="d-prev" aria-label="Vorige dag">‹</button>
        <h2>${esc(longDate(d))}</h2>
        <button class="btn" id="d-next" aria-label="Volgende dag">›</button>
        <input type="date" id="d-pick" value="${d}" style="width:auto">
      </div>
      <span class="row"><button class="btn" id="d-block" ${S.readOnly ? "disabled" : ""}>Ruimte blokkeren</button><button class="btn bar" id="d-new" ${S.readOnly ? "disabled" : ""}>Reservering op deze dag</button></span>
    </div>
    <div class="panel stats">
      <div class="stat"><span class="eyebrow">Drukte</span><b><span class="chip c${c.lvl}" style="font-size:1rem">${esc(c.lvlName)}</span></b></div>
      <div class="stat pitch"><span class="eyebrow">Verwachte bezoekers</span><b class="num">${c.total}</b></div>
      <div class="stat pitch"><span class="eyebrow">Thuiswedstrijden</span><b class="num">${c.count}</b></div>
      <div class="stat pitch"><span class="eyebrow">Drukste moment</span><b class="num">${c.peakAt != null ? fromMin(c.peakAt) : "–"}</b><span class="muted small">${c.peak ? "±" + c.peak + " tegelijk op het park" : ""}</span></div>
      <div class="stat bar"><span class="eyebrow">Horeca-reserveringen</span><b class="num">${rs.length}</b></div>
    </div>
    <div class="panel stack">
      <div class="row spread"><h3>Ruimtes en tijden</h3><span class="small muted">Klik op een reservering om te bewerken</span></div>
      ${S.settings.rooms.length ? `<div class="tl-wrap"><div class="tl">
        <div></div><div class="track hours">${hours.map(h => `<span class="hr num" style="left:${((h * 60 - H0) / span * 100).toFixed(2)}%">${pad(h % 24)}:00</span>`).join("")}</div>
        <div class="lab"><b style="color:var(--pitch)">Wedstrijden</b><span class="muted small">drukte op het park</span></div><div class="track">${gridL}${dens}${nowLine}</div>
        ${roomRows}
        ${apptRow(d, pos, gridL, nowLine)}
      </div></div>` : `<p class="empty">Voeg onder Instellingen jullie ruimtes toe om te zien welke vrij zijn.</p>`}
    </div>
    ${blocksPanel(d)}
    <div class="grid2">
      <div class="panel"><h3 style="color:var(--pitch)">Wedstrijden (${ms.length})</h3>
        ${ms.length ? `<div class="list">${ms.map(m => `<div class="it"><span class="t">${esc(m.time || "–")}</span><span>${esc(m.team)}${m.opponent ? ` <span class="muted">– ${esc(m.opponent)}</span>` : ""}${m.home === false ? ` <span class="chip c0">uit</span>` : ""}</span><span class="muted small">${esc(m.field || "")}</span></div>`).join("")}</div>` : `<p class="empty">Geen wedstrijden geïmporteerd voor deze dag.</p>`}
      </div>
      <div class="stack">
        <div class="panel"><h3 style="color:var(--bar)">Horeca-reserveringen (${rs.length})</h3>
          ${rs.length ? `<div class="list">${rs.map(r => `<div class="it" data-res="${esc(r.id)}" style="cursor:pointer"><span class="t">${esc(r.start)}–${esc(r.end)}</span><span><b>${esc(r.customer || "Reservering")}</b><br><span class="muted small">${esc(roomName(r.roomId))}${r.persons ? " · " + esc(r.persons) + " pers." : ""}${r.arrangementId && arr(r.arrangementId) ? " · " + esc(arr(r.arrangementId).name) : ""}</span></span>${statusChip(r.status)}</div>`).join("")}</div>` : `<p class="empty">Nog niets gereserveerd.</p>`}
        </div>
        <div class="panel"><h3 style="color:var(--club)">Clubagenda (${cl.length})</h3>
          ${cl.length ? `<div class="list">${cl.map(ev => `<div class="it"><span class="t">${ev.allDay ? "hele dag" : esc(ev.start)}</span><span>${esc(ev.title)}${ev.location ? `<br><span class="muted small">${esc(ev.location)}</span>` : ""}</span><span></span></div>`).join("")}</div>` : `<p class="empty">Niets in de clubagenda.</p>`}
          ${unmatched.length && S.settings.rooms.length ? `<p class="small muted">${unmatched.length} item(s) konden niet aan een ruimte gekoppeld worden. Voeg zoekwoorden toe bij de ruimte onder Instellingen.</p>` : ""}
        </div>
      </div>
    </div>
  </section>`;
}
after.dag = () => {
  $("#d-prev").onclick = () => { S.day = addDays(S.day, -1); render(); };
  $("#d-next").onclick = () => { S.day = addDays(S.day, 1); render(); };
  $("#d-pick").onchange = e => { if (e.target.value) { S.day = e.target.value; render(); } };
  $("#d-new").onclick = () => openRes({ date: S.day });
  dagAfterDag();
  document.querySelectorAll("[data-res]").forEach(el => el.onclick = () => openRes(S.reservations.get(el.dataset.res)));
};

/* ---------- Dashboard (startscherm, naar voorbeeld van Restau) ---------- */
function vHome() {
  const res = [...S.reservations.values()], qs = [...S.quotes.values()];
  const in30 = addDays(todayISO, 30);
  const upcoming = res.filter(r => r.date >= todayISO && r.status !== "geannuleerd").sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  const tasks = allTasks().filter(taskOpen);
  const qOf = r => r.quoteId && S.quotes.get(r.quoteId);
  const openPay = finRows().filter(x => x.terms.some(t => !t.paid));
  const tile = (n, label, go, cls = "") => `<button type="button" class="tile ${cls} ${n ? "" : "zero"}" data-go='${esc(JSON.stringify(go))}'><b>${n}</b><span>${esc(label)}</span></button>`;
  const today = resOn(todayISO), c = crowd(todayISO);
  return `<section class="stack">
    <div class="row spread"><h2>Dashboard</h2><div class="row"><button class="btn" id="h-newres" ${S.readOnly ? "disabled" : ""}>Nieuwe reservering</button><button class="btn primary" id="h-newq" ${S.readOnly ? "disabled" : ""}>Nieuwe offerte maken</button></div></div>
    <div class="tiles">
      ${tile(res.filter(r => r.status === "aanvraag").length, "Nieuwe aanvragen", { v: "res", resFilter: "aanvragen" })}
      ${tile(qs.filter(q => q.status === "concept" || q.status === "verstuurd").length, "Openstaande offertes", { v: "off", offTab: "open" })}
      ${tile(res.filter(r => r.status === "optie" && r.date >= todayISO).length, "In optie", { v: "res", resFilter: "opties" })}
      ${tile(upcoming.filter(r => r.date <= in30 && r.status === "bevestigd").length, "Events komende 30 dagen", { v: "res", resFilter: "komend" }, "teal")}
      ${tile(tasks.filter(t => t.due && t.due <= todayISO).length, "To-do's voor vandaag of eerder", { v: "todo", todoFilter: "open" })}
      ${tile(openPay.length, "Betalingen nog open", { v: "betalingen" }, "teal")}
    </div>
    <div class="grid2">
      <div class="panel stack"><div class="row spread"><h3>Vandaag</h3><button class="btn" data-go='{"v":"dag","day":"${todayISO}"}'>Dag-agenda</button></div>
        <p style="margin:0">${esc(longDate(todayISO))}: ${c.total ? `ongeveer <b>${c.total}</b> verwachte bezoekers (${esc(c.lvlName)})` : "geen wedstrijden of feesten bekend"}, ${today.length} ${today.length === 1 ? "reservering" : "reserveringen"}.</p>
        ${today.length ? `<div class="list">${today.map(r => `<div class="it" data-res="${esc(r.id)}" style="cursor:pointer"><span class="t">${esc(r.start)}</span><span><b>${esc(r.customer || "Reservering")}</b><br><span class="muted small">${esc(roomName(r.roomId))}${r.persons ? " · " + esc(r.persons) + " pers." : ""}</span></span>${statusChip(r.status)}</div>`).join("")}</div>` : ""}
      </div>
      <div class="panel stack"><div class="row spread"><h3>To-do's</h3><button class="btn" data-go='{"v":"todo","todoFilter":"open"}'>Alle to-do's</button></div>
        ${tasks.length ? `<div class="list">${tasks.slice(0, 6).map(t => `<div class="it" data-res="${esc(t.r.id)}" style="cursor:pointer"><span class="t" style="${t.due && t.due < todayISO ? "color:var(--bad)" : ""}">${t.due ? esc(shortDate(t.due)) : "–"}</span><span>${esc(t.text)}<br><span class="muted small">${esc(t.r.customer || "")} · ${esc(shortDate(t.r.date))}</span></span><span></span></div>`).join("")}</div>` : `<p class="empty">Geen open to-do's.</p>`}
      </div>
    </div>
    <div class="grid2">
      <div class="panel stack"><h3>Aankomende events</h3>
        ${upcoming.length ? `<div class="tbl-wrap"><table><tbody>${upcoming.slice(0, 10).map(r => `<tr class="click" data-res="${esc(r.id)}"><td class="num">${esc(shortDate(r.date))}</td><td><b>${esc(r.customer || "")}</b><br><span class="muted small">${esc(roomName(r.roomId))}${r.persons ? " · " + esc(r.persons) + " pers." : ""}</span></td><td>${statusChip(r.status)}</td><td class="r">${qOf(r) ? eur(totals(qOf(r).lines).incl) : ""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Geen komende events.</p>`}
      </div>
      <div class="panel stack"><h3>Nieuwste offertes</h3>
        ${qs.length ? `<div class="tbl-wrap"><table><tbody>${qs.sort((a, b) => String(b.number).localeCompare(String(a.number))).slice(0, 8).map(q => `<tr class="click" data-q="${esc(q.id)}"><td class="num"><b>${esc(q.number)}</b></td><td>${esc(q.customer || "")}<br><span class="muted small">${q.eventDate ? esc(shortDate(q.eventDate)) : ""}</span></td><td>${statusChip(q.status)}</td><td class="r">${eur(totals(q.lines).incl)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Nog geen offertes.</p>`}
      </div>
    </div>
  </section>`;
}
after.home = () => {

/* ---------- To-do-lijst over alle reserveringen ---------- */
function allTasks() {
  const out = [];
  for (const r of S.reservations.values()) {
    if (r.status === "geannuleerd") continue;
    (r.tasks || []).forEach((t, i) => out.push({ ...t, i, r }));
  }
  return out.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || (a.r.date || "").localeCompare(b.r.date || ""));
}
// Status van een to-do zoals in Restau: klaar, bezig, achterstallig of geannuleerd.
const taskOpen = t => !t.done && t.status !== "geannuleerd";
const taskState = t => t.done ? "klaar" : t.status === "geannuleerd" ? "geannuleerd" : t.due && t.due < todayISO ? "achterstallig" : t.status === "bezig" ? "bezig" : "open";
const TASK_STATES = { open: ["Open", "c2"], bezig: ["Bezig", "c4"], achterstallig: ["Achterstallig", "c3"], klaar: ["Klaar", "c1"], geannuleerd: ["Geannuleerd", "c0"] };
function vTodo() {
  const f = S.todoFilter || "open", fm = S.todoMgr || "", all = allTasks().filter(t => mgrMatch(t.manager || t.r.manager || "", fm)), q = (S.todoQuery || "").trim().toLowerCase();
  const inTab = (t, k) => k === "alle" ? true : k === "open" ? taskOpen(t) : k === "done" ? t.done : k === "late" ? taskState(t) === "achterstallig" : k === "bezig" ? taskOpen(t) && t.status === "bezig" : k === "geannuleerd" ? t.status === "geannuleerd" && !t.done : true;
  let list = all.filter(t => inTab(t, f));
  if (q) list = list.filter(t => [t.text, t.r.customer, roomName(t.r.roomId), t.manager, t.note].join(" ").toLowerCase().includes(q));
  if (f === "done") list.reverse();
  const groups = new Map();
  for (const t of list) {
    const k = !t.due ? "Zonder datum" : t.due < todayISO && taskOpen(t) ? "Achterstallig" : t.due === todayISO ? "Vandaag" : longDate(t.due);
    if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t);
  }
  const TABS = [["open", "Open"], ["bezig", "Bezig"], ["late", "Achterstallig"], ["done", "Klaar"], ["geannuleerd", "Geannuleerd"], ["alle", "Alle"]];
  const mgrs = S.settings.locatie?.managers || [], ro = S.readOnly ? "disabled" : "";
  return `<section class="stack">
    <div class="row spread"><h2>To-do-lijst</h2><div class="row">
      <select id="td-mgr" style="width:auto" aria-label="Manager"><option value="">Alle managers</option>${mgrs.map(m => `<option ${m === fm ? "selected" : ""}>${esc(m)}</option>`).join("")}<option value="__none" ${fm === "__none" ? "selected" : ""}>Geen manager</option></select>
      <input id="td-q" type="search" placeholder="Zoek op taak of klant" value="${esc(S.todoQuery || "")}" style="max-width:240px">
      <button class="btn primary" id="td-new" ${ro}>Nieuwe to-do</button></div></div>
    <div class="ptabs" role="group" aria-label="Welke to-do's">${TABS.map(([k, l]) => `<button type="button" data-tdf="${k}" aria-pressed="${k === f}">${l}<span class="muted">${all.filter(t => inTab(t, k)).length}</span></button>`).join("")}</div>
    <p class="small muted" style="margin:0">To-do's horen bij een event. Ze komen uit de standaardtaken, uit producten op de offerte, of je zet ze hier of in de reservering.</p>
    ${groups.size ? [...groups.entries()].map(([k, ts]) => `<div class="panel stack" style="gap:4px"><h3 style="${k === "Achterstallig" ? "color:var(--bad)" : ""}">${esc(k)} <span class="small muted">${ts.length}</span></h3>
      <div>${ts.map(t => { const st = taskState(t), key = esc(t.r.id) + ":" + t.i; return `<div class="todo-row ${t.done || st === "geannuleerd" ? "done" : ""}"><input type="checkbox" data-tdone="${key}" ${t.done ? "checked" : ""} ${ro} aria-label="Klaar: ${esc(t.text)}"><div><span class="tt">${esc(t.text)}</span>${st === "open" ? "" : ` <span class="chip ${TASK_STATES[st][1]}">${TASK_STATES[st][0]}</span>`}<br><a href="#" class="small" data-res="${esc(t.r.id)}">${esc(t.r.customer || "Reservering")} · ${esc(shortDate(t.r.date))}${t.r.roomId ? " · " + esc(roomName(t.r.roomId)) : ""}</a>${t.due ? ` <span class="small muted">· uiterlijk ${esc(shortDate(t.due))}</span>` : ""}</div>
        <div class="row td-ctl"><select data-tstat="${key}" aria-label="Status" ${ro}>${[["open", "Open"], ["bezig", "Bezig"], ["klaar", "Klaar"], ["geannuleerd", "Geannuleerd"]].map(([v, l]) => `<option value="${v}" ${(t.done ? "klaar" : t.status || "open") === v ? "selected" : ""}>${l}</option>`).join("")}</select>

/* ---------- Agenda-koppeling: .ics-bestand voor Outlook of Google ---------- */
async function saveFile(filename, data, type = "text/plain") {
  let dl = null; try { dl = await window.claude?.use?.("downloads"); } catch (e) {}
  if (dl) { try { await dl.save({ filename, data }); return true; } catch (e) { if (e?.code !== "declined") toast("Downloaden lukte niet"); return false; } }
  try { const url = URL.createObjectURL(new Blob([data], { type })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return true; }
  catch (e) { toast("Downloaden is hier niet beschikbaar"); return false; }
}
function icsFor(list) {
  const pad = n => String(n).padStart(2, "0"), stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const dt = (d, t) => d.replace(/-/g, "") + "T" + (t || "00:00").replace(":", "") + "00";
  const escI = x => String(x || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/[,;]/g, m => "\\" + m);
  const ev = list.map(r => {
    let endD = r.date; if (r.end && r.start && r.end <= r.start) endD = addDays(r.date, 1);
    return ["BEGIN:VEVENT", `UID:${r.id}@hct-horeca`, `DTSTAMP:${stamp}`, `DTSTART;TZID=Europe/Amsterdam:${dt(r.date, r.start)}`, `DTEND;TZID=Europe/Amsterdam:${dt(endD, r.end || r.start)}`,
      `SUMMARY:${escI((r.status === "optie" ? "[optie] " : "") + (r.customer || "Reservering") + (r.persons ? ` (${r.persons} p.)` : ""))}`, `LOCATION:${escI(roomName(r.roomId))}`,
      `DESCRIPTION:${escI([r.status, arr(r.arrangementId)?.name, r.notes].filter(Boolean).join("\n"))}`, "END:VEVENT"].join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//HC Tilburg//Horeca-agenda//NL", "CALSCALE:GREGORIAN", "X-WR-CALNAME:HC Tilburg horeca", ...ev, "END:VCALENDAR"].join("\r\n");
}
function vKoppeling() {
  const k = S.icsKind || "alles";
  const sel = [...S.reservations.values()].filter(r => r.date >= addDays(todayISO, -30) && (k === "alles" ? ["optie", "bevestigd", "aanvraag"].includes(r.status) : k === "bevestigd" ? r.status === "bevestigd" : r.status === "optie"));
  return `<section class="stack"><div class="row spread"><h2>Agenda-koppeling</h2></div>
    <div class="panel stack">
      <p style="margin:0">Zet de reserveringen in Outlook of Google Agenda met een agendabestand (.ics). Open het bestand op je computer of telefoon, dan komen de feesten in je eigen agenda.</p>
      <div class="ptabs" role="group" aria-label="Welke reserveringen">${[["alles", "Bevestigd, in optie en aanvragen"], ["bevestigd", "Alleen bevestigd"], ["optie", "Alleen in optie"]].map(([v, l]) => `<button type="button" data-ick="${v}" aria-pressed="${v === k}">${l}</button>`).join("")}</div>
      <div class="row"><button class="btn primary" id="ics-dl">Download agendabestand (${sel.length} ${sel.length === 1 ? "reservering" : "reserveringen"})</button></div>
      <p class="small muted" style="margin:0">Het bestand is een momentopname van vanaf 30 dagen geleden. Download het opnieuw na wijzigingen; Outlook en Google werken bestaande afspraken dan bij.</p>

}
after.koppeling = () => {
  document.querySelectorAll("[data-ick]").forEach(b => b.onclick = () => { S.icsKind = b.dataset.ick; render(); });

function actionPanel() {
  const horizon = addDays(todayISO, 7), items = [];
  for (const r of S.reservations.values()) {
    if (r.status === "geannuleerd" || r.status === "afgerond") continue;
    if (r.status === "optie" && r.optieTot && r.optieTot < todayISO) items.push({ r, due: r.optieTot, text: "Optie is verlopen: bevestigen of vrijgeven", bad: true });
    if (r.status === "aanvraag") items.push({ r, due: r.createdAt ? r.createdAt.slice(0, 10) : todayISO, text: "Nieuwe aanvraag beantwoorden" });
    for (const t of r.tasks || []) if (!t.done && t.due && t.due <= horizon) items.push({ r, due: t.due, text: t.text, bad: t.due < todayISO });
  }
  items.sort((a, b) => a.due.localeCompare(b.due));
  if (!items.length) return "";
  return `<div class="panel stack"><div class="row spread"><h3>Actie nodig</h3><span class="small muted">${items.length} open, komende 7 dagen</span></div>

}

  if (rm && +rm.rent) lines.push({ desc: `Huur ${rm.name} (${r.start}–${r.end})`, qty: 1, price: +rm.rent, btw: 21, category: "Zaalhuur" });
  if (!lines.length) lines.push({ desc: "", qty: 1, price: 0, btw: 9 });

    date: todayISO, validUntil: iso(valid), lines, notes: "", createdAt: new Date().toISOString(),

    const parts = isMix(l) ? [[21, t * l.btwHigh / 100], [9, t * (100 - l.btwHigh) / 100]] : [[+l.btw || 0, t]];

/* ICS */
function parseICS(text) {
  const lines = text.replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "").split(/\r?\n/);
  const evs = []; let cur = null;
  for (const ln of lines) {
    if (ln === "BEGIN:VEVENT") { cur = { exdates: [] }; continue; }
    if (ln === "END:VEVENT") { if (cur) evs.push(cur); cur = null; continue; }
    if (!cur) continue;
    const i = ln.indexOf(":"); if (i < 0) continue;
    const [name, ...params] = ln.slice(0, i).split(";"); const val = ln.slice(i + 1);
    const unesc = v => v.replace(/\\n/gi, " ").replace(/\\([,;\\])/g, "$1");
    if (name === "SUMMARY") cur.title = unesc(val);
    else if (name === "LOCATION") cur.location = unesc(val);
    else if (name === "DTSTART") cur.start = icsDate(val, params);
    else if (name === "DTEND") cur.end = icsDate(val, params);
    else if (name === "RRULE") cur.rrule = Object.fromEntries(val.split(";").map(p => p.split("=")));
    else if (name === "EXDATE") val.split(",").forEach(v => { const d = icsDate(v, params); if (d) cur.exdates.push(iso(d.d)); });
    else if (name === "STATUS") cur.status = val;
    else if (name === "RECURRENCE-ID") cur.recurrenceId = icsDate(val, params);
    else if (name === "UID") cur.uid = val;
  }
  const out = [];
  const overrides = new Set(evs.filter(e => e.recurrenceId).map(e => e.uid + "|" + iso(e.recurrenceId.d)));
  const horizon = new Date(); horizon.setFullYear(horizon.getFullYear() + 2);
  for (const e of evs) {
    if (!e.start || e.status === "CANCELLED") continue;
    const durMs = e.end ? e.end.d - e.start.d : (e.start.allDay ? 864e5 : 36e5);
    const push = d => {
      const ds = iso(d); if (e.exdates.includes(ds)) return;
      if (!e.recurrenceId && overrides.has(e.uid + "|" + ds)) return;
      const end = new Date(d.getTime() + durMs);
      if (e.start.allDay) {
        for (let x = new Date(d); x < end; x.setDate(x.getDate() + 1)) out.push({ date: iso(x), allDay: true, title: e.title || "(geen titel)", location: e.location || "" });
      } else out.push({ date: ds, start: `${pad(d.getHours())}:${pad(d.getMinutes())}`, end: iso(end) === ds ? `${pad(end.getHours())}:${pad(end.getMinutes())}` : "23:59", title: e.title || "(geen titel)", location: e.location || "" });
    };
    if (!e.rrule) { push(e.start.d); continue; }
    const R = e.rrule, freq = R.FREQ, intv = +R.INTERVAL || 1, count = +R.COUNT || Infinity;
    const until = R.UNTIL ? icsDate(R.UNTIL, []).d : horizon;
    const byday = R.BYDAY ? R.BYDAY.split(",").map(x => ["SU", "MO", "TU", "WE", "TH", "FR", "SA"].indexOf(x.slice(-2))) : null;
    let n = 0; const d0 = e.start.d;
    if (freq === "WEEKLY") {
      const days = byday || [d0.getDay()];
      const wk = new Date(d0); wk.setDate(d0.getDate() - ((d0.getDay() + 6) % 7));
      for (let w = 0; n < count && n < 1000; w += intv) {
        const base = new Date(wk); base.setDate(wk.getDate() + w * 7);
        if (base > until || base > horizon) break;
        for (const dd of [...days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7))) {
          const x = new Date(base); x.setDate(base.getDate() + ((dd + 6) % 7)); x.setHours(d0.getHours(), d0.getMinutes(), 0, 0);

}

    ${up.length ? `<div class="tbl-wrap"><table><thead><tr><th>Datum</th><th>Tijd</th><th>Titel</th><th>Locatie</th></tr></thead><tbody>${up.slice(0, 6).map(x => `<tr><td class="num">${esc(shortDate(x.date))}</td><td class="num">${x.allDay ? "hele dag" : esc(x.start)}</td><td>${esc(x.title)}</td><td>${esc(x.location)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="small muted">Geen items vanaf vandaag.</p>`}
    <label class="check small"><input type="checkbox" id="ics-past" ${I.keepPast ? "checked" : ""}> Ook items uit het verleden bewaren</label>
    <div class="row"><button class="btn primary" id="ics-go" ${S.readOnly ? "disabled" : ""}>Importeer clubagenda</button><button class="btn ghost" id="ics-cancel">Annuleren</button></div>

after.import = () => {
  const wireDrop = (id, fn) => { const z = $(id); z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); }); z.addEventListener("dragleave", () => z.classList.remove("over")); z.addEventListener("drop", e => { e.preventDefault(); z.classList.remove("over"); if (!S.readOnly && e.dataTransfer.files.length) fn(e.dataTransfer.files); }); };
  const lisaFn = files => readLisaFiles(files).catch(() => toast("Dit bestand kon ik niet lezen. Is het een Excel- of CSV-bestand?"));
  const icsFn = async files => { try { const f = files[0]; const items = parseICS(await f.text()); if (!items.length) { toast("Geen afspraken gevonden in dit bestand"); return; } S.importIcs = { file: f.name, items, keepPast: false }; render(); } catch (e) { toast("Dit .ics-bestand kon ik niet lezen"); } };
  $("#lisa-file").onchange = e => lisaFn(e.target.files); wireDrop("#lisa-drop", lisaFn);
  $("#lisa-paste-go").onclick = () => { try { readPasted($("#lisa-paste").value); } catch (e) { toast("Deze tabel kon ik niet lezen"); } };
  $("#ics-file").onchange = e => icsFn(e.target.files); wireDrop("#ics-drop", icsFn);
  const L = S.importLisa;
  if (L) {
    document.querySelectorAll("[data-map]").forEach(s => s.onchange = e => { L.map[s.dataset.map] = e.target.value === "" ? "" : +e.target.value; render(); });
    $("#lisa-fallback").onchange = e => { L.fallback = e.target.value; render(); };
    $("#lisa-allhome").onchange = e => { L.allHome = e.target.checked; render(); };
    $("#lisa-cancel").onclick = () => { S.importLisa = null; render(); };
    $("#lisa-go").onclick = async () => {
      const rows = lisaRows(L), by = {};
      rows.forEach(r => { (by[r.date] = by[r.date] || []).push({ time: r.time, team: r.team, opponent: r.opponent, field: r.field, home: r.home }); });
      const now = new Date().toISOString(); let ok = 0;
      const importMap = {}; FIELDS.forEach(([k]) => { if (L.map[k] !== "" && L.map[k] != null) importMap[k] = L.headers[L.map[k]]; });
      if (JSON.stringify(importMap) !== JSON.stringify(S.settings.importMap || {})) await write("settings/main", JSON.parse(JSON.stringify({ ...S.settings, importMap })));
      for (const [d, items] of Object.entries(by)) if (await write("matches/" + d, { date: d, items, importedAt: now, source: L.files.join(", ") })) ok++;
      S.importLisa = null; toast(`${rows.length} wedstrijden op ${ok} dag(en) geïmporteerd`);
      const first = Object.keys(by).sort()[0]; if (first) { S.day = first; S.month = first.slice(0, 7); }
      render();
    };
  }
  const I = S.importIcs;
  if (I) {
    $("#ics-past").onchange = e => { I.keepPast = e.target.checked; };
    $("#ics-cancel").onclick = () => { S.importIcs = null; render(); };
    $("#ics-go").onclick = async () => {
      const items = I.items.filter(x => I.keepPast || x.date >= todayISO.slice(0, 7) + "-01");
      const by = {}; items.forEach(x => (by[x.date.slice(0, 7)] = by[x.date.slice(0, 7)] || []).push(x));
      const now = new Date().toISOString(); let n = 0;
      for (const [m, list] of Object.entries(by)) { if (await write("club/" + m, { month: m, items: list, importedAt: now, source: I.file })) n += list.length; }
      S.importIcs = null; toast(`${n} items uit de clubagenda geïmporteerd`); render();
    };
  }
};

  };
  document.querySelectorAll("#app input, #app select, #app textarea").forEach(el => el.addEventListener("input", sync));

  const palette = ["#e5621c", "#1b7d88", "#3d5a9e", "#8e3b6e", "#6b7d1f", "#a8432f"];

  $("#s-addarr").onclick = () => { sync(); s.arrangementen.push({ id: uid(), name: "", description: "", price: 0, btw: 9 }); render(); };

    sync(); const a = s.rooms[+cb.closest("tr").dataset.roomx], b = s.rooms.find(x => x.id === cb.dataset.link); if (!a || !b) return;

    set(a, b.id, cb.checked); set(b, a.id, cb.checked); render();
  });
  document.querySelectorAll("[data-delroom]").forEach(b => b.onclick = () => { sync(); const gone = s.rooms.splice(+b.dataset.delroom, 1)[0]; s.rooms.forEach(x => { if (x.linkedRooms) x.linkedRooms = x.linkedRooms.filter(y => y !== gone?.id); }); render(); });

const CONTACT_KINDS = { gebeld: "Gebeld", gemaild: "Gemaild", whatsapp: "WhatsApp", afspraak: "Afspraak of bezichtiging", gesprek: "Gesprek in het clubhuis", terugkoppeling: "Terugkoppeling na het feest", notitie: "Notitie" };

const fmtAt = s => s ? `${shortDate(s.slice(0, 10))}${s.length > 10 ? " " + s.slice(11, 16) : ""}` : "";

function findCustomer(d) {
  if (d.customerId && S.customers.has(d.customerId)) return S.customers.get(d.customerId);
  const all = [...S.customers.values()], em = normName(d.email), nm = normName(d.customer ?? d.name);
  return (em && all.find(c => normName(c.email) === em)) || (nm && all.find(c => normName(c.name) === nm)) || null;
}
const belongsTo = (x, c) => x.customerId ? x.customerId === c.id : !!x.customer && normName(x.customer) === normName(c.name);
function custData(c) {
  const res = [...S.reservations.values()].filter(r => belongsTo(r, c)).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const quotes = [...S.quotes.values()].filter(q => belongsTo(q, c)).sort((a, b) => String(b.number).localeCompare(String(a.number)));
  const contacts = [...S.contacts.values()].filter(k => k.customerId === c.id).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  const omzet = quotes.filter(q => q.status === "geaccepteerd").reduce((s, q) => s + totals(q.lines).incl, 0);
  const upcoming = res.filter(r => r.date >= todayISO && r.status !== "geannuleerd");
  const next = contacts.filter(k => k.followUp && !k.followDone).sort((a, b) => a.followUp.localeCompare(b.followUp))[0];
  const last = [contacts.find(k => (k.at || "").slice(0, 10) <= todayISO)?.at?.slice(0, 10), res.find(r => r.date <= todayISO)?.date].filter(Boolean).sort().pop() || "";
  return { res, quotes, contacts, omzet, upcoming, next, last, openQuotes: quotes.filter(q => q.status === "concept" || q.status === "verstuurd") };

// Koppelt een reservering of offerte aan een klant; maakt de klant aan als die nog niet bestaat.
async function ensureCustomer(d) {
  if (!String(d.customer || "").trim()) return d.customerId || "";
  let c = findCustomer(d);
  if (c) {
    const fill = {}; ["contact", "phone", "email"].forEach(k => { if (d[k] && !c[k]) fill[k] = d[k]; });
    if (Object.keys(fill).length) await write("customers/" + c.id, { ...fill, updatedAt: new Date().toISOString() }, "update");
    return c.id;
  }
  const id = uid(), t = new Date().toISOString();
  const body = { name: d.customer.trim(), type: "particulier", contact: d.contact || "", phone: d.phone || "", email: d.email || "", address: "", invoice: "", notes: "", createdAt: t, updatedAt: t };
  if (!(await write("customers/" + id, body))) return "";
  S.customers.set(id, { ...body, id });
  return id;
}
async function addContact(c, k) {
  const id = uid();
  const body = { customerId: c.id, at: k.at || nowLocal(), kind: k.kind || "notitie", text: k.text || "", followUp: k.followUp || "", followText: k.followText || "", followDone: false, ref: k.ref || null, createdAt: new Date().toISOString() };
  return write("contacts/" + id, body);
}
// Legt automatisch een contactmoment vast als een offerte verstuurd wordt, en sluit de opvolging als hij beantwoord is.
async function logQuoteStatus(q, before) {
  const c = q.customerId && S.customers.get(q.customerId); if (!c || before === q.status) return;
  if (q.status === "verstuurd") {
    let fu = addDays(todayISO, 5); if (q.validUntil && q.validUntil < fu) fu = q.validUntil;
    await addContact(c, { kind: "gemaild", text: `Offerte ${q.number} verstuurd (${eur(totals(q.lines).incl)})`, followUp: fu, followText: `Offerte ${q.number} nabellen`, ref: { type: "quote", id: q.id } });
  }
  if (q.status === "geaccepteerd" || q.status === "afgewezen") {
    for (const k of S.contacts.values()) if (k.ref?.type === "quote" && k.ref.id === q.id && !k.followDone) await write("contacts/" + k.id, { followDone: true }, "update");
    await addContact(c, { kind: "notitie", text: `Offerte ${q.number} ${q.status}${q.status === "afgewezen" && q.declineReason ? ": " + q.declineReason : ""}`, ref: { type: "quote", id: q.id } });
  }
}

function custActions(days = 7) {

    const c = S.customers.get(k.customerId); if (!c) continue;
    if (k.followUp && !k.followDone && k.followUp <= horizon) out.push({ c, date: k.followUp, title: k.followText || "Opvolgen", sub: k.text, late: k.followUp < todayISO, chip: k.followUp < todayISO ? "te laat" : "opvolgen" });

  }
  for (const r of S.reservations.values()) {

    const c = findCustomer(r); if (!c) continue;

/* ---------- Dagindeling, opstellingen en ruimte blokkeren (naar voorbeeld van Restau) ---------- */
/* Plakken in horeca-agenda.html binnen de IIFE, vóór de regel `boot();`. Zie dagindeling-integratie.md. */
const DEFAULT_OPSTELLINGEN = ["Staand", "Staand + zithoek(en)", "Lange tafel(s)", "Vierkante tafels", "Lopend buffet", "U-vorm", "Theater", "Carré", "School", "Ronde tafels", "Anders"];
const DEFAULT_EVENT_TYPES = [
  { id: "verjaardag", name: "Verjaardag of feest", optieDagen: 14, parts: [{ name: "Ontvangst", start: "19:30", end: "20:00" }, { name: "Borrel", start: "20:00", end: "22:00" }, { name: "Feest", start: "22:00", end: "00:30" }] },
  { id: "teamfeest", name: "Teamfeest of seizoensafsluiting", optieDagen: 14, parts: [{ name: "Ontvangst", start: "18:00", end: "18:30" }, { name: "Buffet of diner", start: "18:30", end: "20:00" }, { name: "Feest", start: "20:00", end: "23:30" }] },
  { id: "bedrijf", name: "Bedrijfsborrel", optieDagen: 14, parts: [{ name: "Ontvangst", start: "16:30", end: "17:00" }, { name: "Borrel", start: "17:00", end: "19:00" }] },
  { id: "vergadering", name: "Vergadering", optieDagen: 7, parts: [{ name: "Ontvangst", start: "09:00", end: "09:30" }, { name: "Vergadering ochtend", start: "09:30", end: "12:30" }, { name: "Lunch", start: "12:30", end: "13:15" }, { name: "Vergadering middag", start: "13:15", end: "17:00" }] },
  { id: "kinderfeest", name: "Kinderfeest of clinic", optieDagen: 7, parts: [{ name: "Ontvangst", start: "13:30", end: "14:00" }, { name: "Activiteit", start: "14:00", end: "16:00" }, { name: "Afsluiting met patat", start: "16:00", end: "17:00" }] },
  { id: "lunch", name: "Lunch team of toernooi", optieDagen: 7, parts: [{ name: "Lunch", start: "12:00", end: "13:00" }] },
  { id: "condoleance", name: "Condoleance", optieDagen: 3, parts: [{ name: "Bijeenkomst", start: "14:00", end: "17:00" }] },
  { id: "overig", name: "Overig", optieDagen: 14, parts: [{ name: "Activiteit", start: "19:00", end: "23:00" }] },
];
const eventTypes = () => Array.isArray(S.settings.eventTypes) && S.settings.eventTypes.length ? S.settings.eventTypes : DEFAULT_EVENT_TYPES;
const opstellingen = () => Array.isArray(S.settings.opstellingen) && S.settings.opstellingen.length ? S.settings.opstellingen : DEFAULT_OPSTELLINGEN;
const eventType = id => eventTypes().find(t => t.id === id);
const span2 = (start, end) => { const s = toMin(start); if (s == null) return null; const e0 = toMin(end) ?? s + 180; return [s, e0 <= s ? e0 + 1440 : e0]; };
const partPersons = p => (+p.adults || 0) + (+p.kids || 0);

// Alle stukken (ruimte + tijd) die een reservering bezet: de dagindeling, of anders de hele reservering.
function resParts(r) {
  const parts = (r.dagindeling || []).filter(p => p.start);
  if (!parts.length) return r.roomId && r.start ? [{ name: "", start: r.start, end: r.end, roomId: r.roomId, adults: r.persons, kids: 0, opstelling: r.opstelling || "" }] : [];
  return parts.map(p => ({ ...p, roomId: p.roomId || r.roomId }));
}
// Blokkades op een datum; een wekelijkse blokkade geldt op dezelfde weekdag tot en met de einddatum.
function blocksOn(date) {
  const wd = parseISO(date).getDay();
  return [...S.blocks.values()].filter(b => b.date === date || (b.weekly && b.date <= date && (!b.until || date <= b.until) && parseISO(b.date).getDay() === wd))
    .sort((a, b) => (a.start || "").localeCompare(b.start || ""));
}
const blockSpan = b => b.allDay ? [0, 1440] : span2(b.start, b.end);
const blockRooms = b => b.roomId ? linkedTo(b.roomId) : S.settings.rooms.map(r => r.id);

// Uitbreiding van de bestaande conflictcontrole: stukken in andere ruimtes, blokkades en capaciteit per opstelling.
const _conflictsBase = conflicts;
conflicts = function (r) {
  const out = _conflictsBase(r);
  if (!r.date || r.status === "geannuleerd") return out;
  // De basiscontrole kijkt naar de hele reservering; met een dagindeling telt alleen wat per ruimte echt overlapt.
  const coarse = new Set(resOn(r.date).filter(o => o.id !== r.id && ((o.dagindeling || []).length || (r.dagindeling || []).length))
    .map(o => clashMsg(o, r.roomId)));
  out.hard = out.hard.filter(m => !coarse.has(m)); out.soft = out.soft.filter(m => !coarse.has(m));
  const mine = resParts(r);
  for (const p of mine) {
    const ps = span2(p.start, p.end); if (!ps || !p.roomId) continue;
    for (const o of resOn(r.date)) {
      if (o.id === r.id) continue;
      for (const q of resParts(o)) {
        if (!roomsClash(q.roomId, p.roomId)) continue;
        if (p.roomId === r.roomId && q.roomId === o.roomId && !(r.dagindeling || []).length && !(o.dagindeling || []).length) continue; // al gemeld door de basiscontrole
        const qs = span2(q.start, q.end);
        if (qs && overlaps(ps[0], ps[1], qs[0], qs[1])) (o.status === "aanvraag" || r.status === "aanvraag" ? out.soft : out.hard).push(`${roomName(p.roomId)} is ${p.start}–${p.end} al bezet door ${o.customer || "een andere klant"}${q.name ? " (" + q.name + ")" : ""}${q.roomId !== p.roomId ? ", via de gekoppelde ruimte " + roomName(q.roomId) : ""}.`);
      }
    }
    for (const b of blocksOn(r.date)) {
      if (!blockRooms(b).includes(p.roomId)) continue;
      const bs = blockSpan(b);
      if (bs && overlaps(ps[0], ps[1], bs[0], bs[1])) out.hard.push(`${roomName(p.roomId)} is geblokkeerd ${b.allDay ? "de hele dag" : b.start + "–" + b.end}${b.reason ? ": " + b.reason : ""}.`);
    }
    const rm = room(p.roomId), cap = rm && p.opstelling && rm.caps && +rm.caps[p.opstelling];
    if (cap && partPersons(p) > cap) out.soft.push(`${p.name || "Dit onderdeel"}: ${partPersons(p)} personen past niet in ${rm.name} bij opstelling ${p.opstelling} (max ${cap}).`);
  }
  out.hard = [...new Set(out.hard)]; out.soft = [...new Set(out.soft)];
  return out;
};

/* Reserveringsformulier: soort feest en dagindeling */
function dagResHtml(r) {
  return `<div class="stack" style="gap:6px">
      <div class="row spread"><b>Dagindeling</b>
        <div class="row">
          <select id="rf-type" style="width:auto" aria-label="Soort feest"><option value="">Soort feest…</option>${eventTypes().map(t => `<option value="${esc(t.id)}" ${t.id === r.eventType ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
          <button type="button" class="btn" id="rf-dag-std">Standaard programma</button>
          <button type="button" class="btn" id="rf-dag-add">+ Gelegenheid</button>
        </div>
      </div>
      <div id="rf-dag" class="stack" style="gap:6px"></div>
    </div>`;
}
function dagResWire(r, check) {
  let parts = structuredClone(r.dagindeling || []);
  const rooms = S.settings.rooms, ops = opstellingen();
  const sync = () => {
    document.querySelectorAll("#rf-dag [data-di]").forEach(row => { const p = parts[+row.dataset.di]; row.querySelectorAll("[data-k]").forEach(i => p[i.dataset.k] = i.dataset.k === "adults" || i.dataset.k === "kids" ? (i.value === "" ? "" : +i.value) : i.value); });
  };
  // De hele reservering volgt de dagindeling: vroegste begin, laatste eind, eerste ruimte, grootste aantal personen.
  const roll = () => {
    const ok = parts.filter(p => p.start);
    if (!ok.length) return;
    const starts = ok.map(p => p.start).sort(), first = ok.slice().sort((a, b) => a.start.localeCompare(b.start))[0];
    const ends = ok.map(p => { const s = span2(p.start, p.end); return s ? s[1] : 0; }), endMin = Math.max(...ends);
    $("#rf-start").value = starts[0]; $("#rf-end").value = fromMin(endMin % 1440);
    if (first.roomId) $("#rf-room").value = first.roomId;
    const mx = Math.max(...ok.map(partPersons)); if (mx) $("#rf-persons").value = mx;
  };
  const draw = () => {
    parts.sort((a, b) => (a.start || "99").localeCompare(b.start || "99"));
    const w = (basis, html) => `<span style="flex:${basis};min-width:0">${html}</span>`;
    $("#rf-dag").innerHTML = parts.length ? parts.map((p, i) => `<div class="row" data-di="${i}" style="gap:6px;padding:6px 0;border-top:1px solid var(--line)">
        ${w("2 1 150px", `<input data-k="name" value="${esc(p.name)}" placeholder="Gelegenheid" aria-label="Gelegenheid">`)}
        ${w("1 1 96px", `<input type="time" data-k="start" value="${esc(p.start)}" aria-label="Van">`)}
        ${w("1 1 96px", `<input type="time" data-k="end" value="${esc(p.end)}" aria-label="Tot">`)}
        ${w("0 0 74px", `<input type="number" min="0" data-k="adults" value="${esc(p.adults)}" placeholder="volw." title="Volwassenen" aria-label="Volwassenen">`)}
        ${w("0 0 74px", `<input type="number" min="0" data-k="kids" value="${esc(p.kids)}" placeholder="kind." title="Kinderen" aria-label="Kinderen">`)}
        ${w("1 1 150px", `<select data-k="roomId" aria-label="Ruimte"><option value="">Zelfde ruimte</option>${rooms.map(x => `<option value="${esc(x.id)}" ${x.id === p.roomId ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>`)}
        ${w("1 1 160px", `<select data-k="opstelling" aria-label="Opstelling"><option value="">Opstelling…</option>${ops.map(o => { const rm = room(p.roomId || $("#rf-room")?.value), cap = rm?.caps?.[o]; return `<option value="${esc(o)}" ${o === p.opstelling ? "selected" : ""}>${esc(o)}${cap ? " (max " + cap + ")" : ""}</option>`; }).join("")}</select>`)}
        <button type="button" class="btn ghost" data-ddel="${i}" aria-label="Gelegenheid verwijderen" style="flex:none">✕</button></div>`).join("")
      : `<p class="small muted" style="margin:0">Nog geen dagindeling. Kies een soort feest en laad het standaard programma, of voeg gelegenheden toe zoals ontvangst, borrel en buffet.</p>`;
    document.querySelectorAll("[data-ddel]").forEach(b => b.onclick = () => { sync(); parts.splice(+b.dataset.ddel, 1); draw(); roll(); check(); });
    document.querySelectorAll("#rf-dag [data-k]").forEach(el => el.addEventListener("change", () => { sync(); if (el.dataset.k === "roomId") draw(); roll(); check(); }));
  };
  $("#rf-dag-add").onclick = () => { sync(); const last = parts[parts.length - 1]; parts.push({ name: "", start: last?.end || $("#rf-start").value, end: "", adults: +$("#rf-persons").value || "", kids: "", roomId: "", opstelling: "" }); draw(); };
  $("#rf-dag-std").onclick = () => {
    const t = eventType($("#rf-type").value); if (!t) { toast("Kies eerst een soort feest"); return; }
    sync(); const pers = +$("#rf-persons").value || "";
    parts = (t.parts || []).filter(p => p.on !== false).map(p => ({ name: p.name, start: p.start, end: p.end, adults: pers, kids: "", roomId: "", opstelling: "" }));
    draw(); roll(); check();
  };
  $("#rf-type").onchange = () => {
    const t = eventType($("#rf-type").value);
    if (t && !r.id && t.optieDagen) $("#rf-optieTot").value = addDays(todayISO, +t.optieDagen);
    if (t && !parts.length) $("#rf-dag-std").click();
  };
  draw();
  return () => { sync(); return { eventType: $("#rf-type").value, dagindeling: parts.filter(p => p.name || p.start).map(p => ({ name: p.name || "", start: p.start || "", end: p.end || "", adults: p.adults ?? "", kids: p.kids ?? "", roomId: p.roomId || "", opstelling: p.opstelling || "" })) }; };
}
function dagSheet(r) {
  const parts = r.dagindeling || [];
  if (!parts.length) return "";
  return `<h2>Dagindeling${r.eventType && eventType(r.eventType) ? " · " + esc(eventType(r.eventType).name) : ""}</h2><table><tr><th>Tijd</th><th>Gelegenheid</th><th>Aantal</th><th>Ruimte en opstelling</th></tr>${parts.map(p => `<tr><td class="k">${esc(p.start)}–${esc(p.end)}</td><td>${esc(p.name)}</td><td>${partPersons(p) || ""}${+p.kids ? ` (${+p.kids} kind.)` : ""}</td><td>${esc(roomName(p.roomId || r.roomId))}${p.opstelling ? " · " + esc(p.opstelling) : ""}</td></tr>`).join("")}</table>`;
}

/* Dag- en maandagenda: stukken in andere ruimtes en blokkades */
function dagTimelineExtra(rm, date, pos) {
  let html = "";
  for (const r of resOn(date)) {
    if (!(r.dagindeling || []).length) continue;
    for (const p of resParts(r)) {

function dagInstWire(s, ownerSync) {

/* ---------- Statistiek (naar voorbeeld van Restau) ---------- */

function statRange() {

function statMonths(from, to) {

}
const statQuoteDate = q => q.eventDate || q.date || (q.createdAt || "").slice(0, 10);
const statResQuote = r => r.quoteId && S.quotes.get(r.quoteId);

  const { from, to, label } = statRange(), inR = d => d && d >= from && d <= to;
  const res = [...S.reservations.values()].filter(r => inR(r.date));
  const live = res.filter(r => r.status !== "geannuleerd");
  const quotesEvt = [...S.quotes.values()].filter(q => inR(statQuoteDate(q)));
  const won = quotesEvt.filter(q => q.status === "geaccepteerd");
  const made = [...S.quotes.values()].filter(q => inR(q.date || (q.createdAt || "").slice(0, 10)));
  const decided = made.filter(q => q.status === "geaccepteerd" || q.status === "afgewezen");
  const omzet = won.reduce((s, q) => s + statQuoteTotal(q), 0);
  const months = statMonths(from, to).map(ym => {
    const w = won.filter(q => statQuoteDate(q).startsWith(ym));
    return { ym, omzet: w.reduce((s, q) => s + statQuoteTotal(q), 0), feesten: live.filter(r => r.date.startsWith(ym)).length };
  });
  const group = (items, keyFn, none = "Onbekend") => { const m = new Map(); for (const it of items) { const k = keyFn(it) || none; m.set(k, [...(m.get(k) || []), it]); } return m; };
  const typeName = id => (typeof eventType === "function" && eventType(id)?.name) || "";
  const perType = [...group(live, r => typeName(r.eventType) || (r.arrangementId && arr(r.arrangementId)?.name) || "").entries()].map(([k, rs]) => ({
    k, n: rs.length, pers: rs.reduce((s, r) => s + (+r.persons || 0), 0),
    omzet: rs.map(statResQuote).filter(q => q && q.status === "geaccepteerd").reduce((s, q) => s + statQuoteTotal(q), 0) })).sort((a, b) => b.n - a.n);
  const roomHours = new Map();
  for (const r of live) {
    const parts = typeof resParts === "function" ? resParts(r) : [{ roomId: r.roomId, start: r.start, end: r.end }];
    for (const p of parts) { const s = toMin(p.start), e0 = toMin(p.end); if (s == null || !p.roomId) continue; const e = e0 == null ? s + 180 : e0 <= s ? e0 + 1440 : e0; const x = roomHours.get(p.roomId) || { n: new Set(), h: 0 }; x.n.add(r.id); x.h += (e - s) / 60; roomHours.set(p.roomId, x); }
  }
  const perRoom = [...roomHours.entries()].map(([id, x]) => ({ k: roomName(id), n: x.n.size, h: x.h })).sort((a, b) => b.h - a.h);
  const prod = new Map();
  for (const q of won) for (const l of q.lines || []) {
    if (l.optional || !(l.desc || "").trim()) continue;
    const k = l.desc.split(" – ")[0].trim(), x = prod.get(k) || { k, n: 0, omzet: 0 };
    x.n += +l.qty || 0; x.omzet += (+l.qty || 0) * (+l.price || 0); prod.set(k, x);

  const custs = S.customers ? [...new Set(live.map(r => r.customerId).filter(id => S.customers.has(id)))].map(id => S.customers.get(id)) : [];
  const sources = [...group(custs, c => c.source, "Niet ingevuld").entries()].map(([k, cs]) => ({ k, n: cs.length })).sort((a, b) => b.n - a.n);
  const declines = [...group(made.filter(q => q.status === "afgewezen"), q => q.declineReason, "Geen reden ingevuld").entries()].map(([k, qs]) => ({ k, n: qs.length })).sort((a, b) => b.n - a.n);

}
